<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Schedule — Example</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1628;--panel:#131f33;--line:rgba(255,255,255,.11);--muted:rgba(255,255,255,.62);--muted2:rgba(255,255,255,.38);--orange:#c97d10;--green:#22c55e;--blue:#3b82f6;--violet:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding:22px 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
.banner{border:1px dashed rgba(167,139,250,.6);background:rgba(167,139,250,.08);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner b{color:#fff}
.select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:#fff;font-family:Outfit,sans-serif;font-size:14px;padding:8px 12px}
.select option{color:#000}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);border-radius:999px;padding:9px 16px;font-family:Outfit,sans-serif;font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.card{background:rgba(255,255,255,.055);border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:18px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.16)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{font-family:"Playfair Display",serif;font-size:19px}
.tag{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.nav .title{flex:1;text-align:center;font-family:"Playfair Display",serif;font-size:19px;min-width:180px}
.seg{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04)}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-family:Outfit,sans-serif;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button.on{background:rgba(167,139,250,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.7)}
.jump{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:-4px 0 14px}
.jump button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-family:Outfit,sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.jump button.on{color:#fff;border-color:rgba(167,139,250,.7);background:rgba(167,139,250,.14)}
/* WEEK: packet-style row */
.wk{width:100%;border-collapse:separate;border-spacing:6px 0;table-layout:fixed}
.wk th{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);text-align:center;padding:0 0 8px}
.wk th span{display:block;font-size:15px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:700}
.wk th.today span{color:#c4b5fd}
.wk td{vertical-align:top}
.cell{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-height:92px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:8px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:800;line-height:1.25}
.cell:hover,.cell:focus-visible{outline:1px solid rgba(167,139,250,.75);outline-offset:1px}
.cell .dot{font-size:20px;color:#bbf7d0}
.cell.sell{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.07)}
.cell.ride{border-color:rgba(59,130,246,.7);background:repeating-linear-gradient(45deg,rgba(59,130,246,.22) 0 8px,rgba(59,130,246,.1) 8px 16px);color:#dbeafe}
.cell.meet{border-color:rgba(201,125,16,.7);background:rgba(201,125,16,.16);color:#ffd399}
.cell.off{color:var(--muted2);font-weight:600}
.cell.today{box-shadow:inset 0 0 0 2px rgba(167,139,250,.75)}
.cell small{display:block;font-size:11px;font-weight:600;color:var(--muted2)}
.cell .slots{font-size:11px;font-weight:700;color:var(--muted)}
.sum{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.sum b{color:#fff}
.metric strong{display:block;font-size:30px;font-weight:800;color:#c4b5fd;line-height:1}
.metric span{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:20px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid}
/* DAY: timeline lane */
.axis{position:relative;height:16px;font-size:10px;font-weight:700;color:var(--muted2)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.track{position:relative;height:56px;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px calc(100%/12))}
.sb{position:absolute;top:4px;bottom:4px;border-radius:7px;font-size:11px;font-weight:800;display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap;letter-spacing:.02em}
.sb.blk{background:rgba(201,125,16,.28);border:1px solid rgba(201,125,16,.7);color:#ffd399}
.sb.ride{background:repeating-linear-gradient(45deg,rgba(59,130,246,.38) 0 8px,rgba(59,130,246,.2) 8px 16px);border:1px solid rgba(59,130,246,.75);color:#dbeafe}
.sb.open{border:1px solid rgba(34,197,94,.6);background:rgba(34,197,94,.08);color:#bbf7d0}
.sb.after{border:1px dashed rgba(34,197,94,.85);color:#bbf7d0}
.sb.os{background:rgba(255,255,255,.03)}
.sb.off{background:rgba(255,255,255,.05);color:var(--muted2);justify-content:center}
.plan{margin-top:14px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.plan .lines{flex:1;min-width:220px;font-size:14px;line-height:1.55}
.plan .techs{flex:1;min-width:200px;font-size:13px;color:var(--muted);line-height:1.5}
.plan .techs b{color:#fff}
.foot{margin-top:14px;font-size:12px;color:var(--muted2)}
@media (max-width:720px){.wk{border-spacing:3px 0}.cell{min-height:78px;font-size:11px;padding:6px 3px}.wk th span{font-size:13px}.nav .title{order:-1;flex-basis:100%}}
</style></head>
<body><div class="wrap">
<div class="banner"><span><b>Example only — not the live CRM.</b> On the CRM each HCA sees only their own row after sign-in. Pick an HCA here to preview theirs.</span>
<label>Viewing as <select class="select" id="who"></select></label></div>

<div class="card">
  <div class="card-head"><h2>My Schedule</h2><span class="tag" id="tag">Planned week</span></div>
  <div class="nav">
    <button class="btn" id="prev" type="button" aria-label="Previous week">&lsaquo;</button>
    <div class="title" id="title">—</div>
    <button class="btn" id="next" type="button" aria-label="Next week">&rsaquo;</button>
    <button class="btn" id="today" type="button">Today</button>
    <div class="seg" role="group" aria-label="Schedule view"><button id="vDay" type="button" aria-pressed="false">Day</button><button class="on" id="vWeek" type="button" aria-pressed="true">Week</button></div>
  </div>
  <div class="jump" id="jump"></div>
  <div id="body"></div>
  <div class="foot">Planned schedule. Booked consults stay on the ServiceTitan board.</div>
</div>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
/* ---- schedule data + rules: copied unchanged from crm.html (origin/main 639b465), plus Joseph's "eff" entry ---- */
const SCHED_ANCHOR = new Date(2026, 8, 27);   // Sun 9/27/26 = rotation week 1
const SCHED_HOLIDAYS = { "2026-11-26":"Thanksgiving", "2026-12-25":"Christmas", "2027-01-01":"New Year's Day" };
const HCA_SCHEDULE = {
  "Joseph Ruble":    { sh:[8,16],  days:[1,2,3,4,5], ride:1, crew:"day", mtg:2, oo:[2,9],
                     /* effective Sun 10/4/26: Tue–Sat, ride Fri, sales meeting Wed, 1:1 stays Tue 9:00 */
                     eff:[{ from:"2026-10-04", days:[2,3,4,5,6], ride:5, mtg:3 }],  cap:3, flex:false, rot:["Doug","Hagen","Caleb","Younis"],          techs:[["Younis",1],["Hagen",0],["Doug",0],["Caleb",0]] },
  "Chester Granard": { sh:[8,16],  days:[0,1,2,3,4], ride:2, crew:"day", mtg:3, oo:[1,8],  cap:3, flex:false, rot:["Dan D","Emmanuel","Anderson","Dan D"],  techs:[["Anderson",1],["Dan D",0],["Emmanuel",0]] },
  "Kyle McAlister":  { sh:[8,16],  days:[1,2,3,4,5], ride:3, crew:"day", mtg:2, oo:[2,10], cap:3, flex:false, rot:["Alex","Charles","Younis","Peter"],         techs:[["Alex",1],["Charles",1],["Peter",1],["Younis",0]] },
  "Davis Diosdado":  { sh:[8,16],  days:[1,2,3,4,5], ride:4, crew:"day", mtg:3, oo:[3,9],  cap:3, flex:false, rot:["Alex","Charles","Dewaynne","Alex"],        techs:[["Dewaynne",1],["Alex",0],["Charles",0]] },
  "Trevor Bohm":     { sh:[8,16],  days:[1,3,4,6],   ride:3, crew:"day", mtg:4, oo:[4,10], cap:3, flex:false, rot:["Conrad","Carter","Dan K","Conrad"],        techs:[["Carter",1],["Conrad",0],["Dan K",0]] },
  "Adam Weberg":     { sh:[8,16],  days:[2,3,4,5,6], ride:4, crew:"day", mtg:2, oo:[5,8],  cap:2, /* can take a 3rd on overflow */ flex:false, rot:["Carter","Peter","Anderson","Carter"],      techs:[["Carter",0],["Peter",0],["Anderson",0]] },
  "Samir Khoury":    { sh:[8,18],  days:[2,3,4,5,6], ride:3, crew:"eve", mtg:4, oo:[4,9],  cap:3, flex:false, rot:["Dan D","Dewaynne","Nicco","Dan D"],  techs:[["Dan D",1],["Dewaynne",0],["Nicco",0]] },
  "Amber Maddalena": { sh:[10,18], days:[0,1,2,3,4], ride:2, crew:"eve", mtg:4, oo:[1,10], cap:3, flex:true,  rot:["Emmanuel","Dan K","Nicco","Emmanuel"],     techs:[["Emmanuel",1],["Dan K",1],["Nicco",1]] },
  "Javierre Milo":   { sh:[10,18], days:[0,1,2,3,4], off:["2026-09-27"] /* starts Sundays 10/4 */, ride:4, crew:"eve", mtg:2, oo:[3,10], cap:3, flex:true,  rot:["Hagen","Doug","Caleb","Conrad"],           techs:[["Hagen",1],["Doug",1],["Caleb",1],["Conrad",1]] },
};
const TECH_DAYS = (() => { const MF=[1,2,3,4,5], TS=[2,3,4,5,6], SW=[0,1,2,3];
  return { Hagen:MF, Doug:MF, Caleb:MF, "Dan K":MF, Conrad:MF, Younis:MF, Charles:MF, Nicco:MF,
           Alex:TS, Carter:TS, Peter:TS, Dewaynne:TS, Anderson:TS, "Dan D":SW, Emmanuel:SW }; })();
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function schedIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function schedClock(h){ const w=Math.floor(h), m=(h%1)?":30":":00", x=w>12?w-12:w; return x+m; }
function schedWeek(d){ const days=Math.round((d-SCHED_ANCHOR)/86400000); return ((Math.floor(days/7)%4)+4)%4; }

function schedPlan(p, d){
  const dow = d.getDay(), wk = schedWeek(d);
  if(SCHED_HOLIDAYS[schedIso(d)]) return { blocks:[[7,19,"off",SCHED_HOLIDAYS[schedIso(d)].toUpperCase()+" · CLOSED"]], book:0, lines:[SCHED_HOLIDAYS[schedIso(d)]+" — office closed."], sh:null };
  if(p.days.indexOf(dow) < 0) return { blocks:[[7,19,"off","DAY OFF"]], book:0, lines:["Day off."], sh:null };
  if((p.off||[]).indexOf(schedIso(d)) >= 0) return { blocks:[[7,19,"off","DAY OFF"]], book:0, lines:["Day off."], sh:null };
  const blocks=[], lines=[]; let sh, book;
  if(dow === p.ride){
    const tech = p.rot[wk];
    if(p.crew === "day"){
      sh=[7,16]; blocks.push([7,13.5,"ride","TECH RIDE · "+tech]); blocks.push([14,16,"after","Open · after ride"]);
      lines.push("Tech ride-along with <b>"+esc(tech)+"</b> — meet at 7:00, ride until 1:30.", "2:00–4:00 appointment: revisit or tech flip.");
    } else {
      sh=[10,18]; blocks.push([10,15.5,"ride","TECH RIDE · "+tech]); blocks.push([16,18,"after","Open · after ride"]);
      lines.push("Tech ride-along with <b>"+esc(tech)+"</b> — meet at 10:00, ride until 3:30.", "4:00–6:00 appointment: revisit or tech flip.");
    }
    book = 1;
  } else {
    const isM = dow === p.mtg, ooHere = p.oo[0] === dow;
    sh = (isM && p.flex) ? [8,16] : p.sh;
    if(isM && p.flex) lines.push("Early shift today: 8–4 for the sales meeting.");
    if(isM) lines.push("Sales meeting at 8:00.");
    if(ooHere) lines.push("1:1 with Geoff at "+p.oo[1]+":00.");
    let open = 0;
    for(let s=sh[0]; s<sh[1]; s+=2){
      if(s===8 && isM){ blocks.push([8,10,"blk",(ooHere && p.oo[1]===9) ? "SALES MEETING + 1:1 9:00" : "SALES MEETING 8:00"]); continue; }
      if(ooHere && s===8 && (p.oo[1]===8 || p.oo[1]===9)){ blocks.push([8,10,"blk","1:1 WITH GEOFF "+p.oo[1]+":00"]); continue; }
      if(ooHere && p.oo[1]===10 && s===10){ blocks.push([10,12,"blk","1:1 WITH GEOFF 10:00"]); continue; }
      if(ooHere && p.oo[1]===10 && s===8){ blocks.push([8,10,"blk","No booking · 1:1 at 10"]); continue; }
      blocks.push([s,s+2,"open","Open"]); open++;
    }
    book = Math.min(open, p.cap);
    if(!lines.length) lines.push("Full selling day.");
  }
  if(sh[0] > 7) blocks.unshift([7,sh[0],"os",""]);
  if(sh[1] < 19) blocks.unshift([sh[1],19,"os",""]);
  return { blocks, book, lines, sh };
}


/* ---- new: effective-dated changes. The latest eff entry whose "from" is on or before the day wins. ---- */
function schedFor(p, d){ const iso = schedIso(d); let out = p;
  (p.eff || []).filter(e => e.from <= iso).sort((a,b) => a.from < b.from ? -1 : 1).forEach(e => { out = Object.assign({}, out, e); });
  return out; }
/* ---- packet-style cell text from a day plan ---- */
function packetCell(p, d){
  const pl = schedPlan(schedFor(p, d), d);
  if(!pl.sh) return { kind:"off", text:"–", sub:pl.blocks[0] && pl.blocks[0][3] !== "DAY OFF" ? pl.blocks[0][3] : "", book:0, pl };
  const parts = [];
  pl.blocks.forEach(b => { const t = b[3];
    if(b[2] === "ride") parts.push("R " + t.replace("TECH RIDE · ",""));
    else if(t === "SALES MEETING + 1:1 9:00") parts.push("MTG 8:00", "1:1 9:00");
    else if(t === "SALES MEETING 8:00") parts.push("MTG 8:00");
    else if(t.indexOf("1:1 WITH GEOFF ") === 0) parts.push("1:1 " + t.replace("1:1 WITH GEOFF ",""));
  });
  const early = pl.sh[0] === 8 && pl.sh[1] === 16 && schedFor(p, d).crew === "eve";
  const kind = parts.some(x => x[0] === "R") ? "ride" : parts.length ? "meet" : "sell";
  return { kind, text: parts.length ? parts.join(" + ") : "●", sub: early ? "(8–4)" : "", book: pl.book, pl };
}
const HCAS = Object.keys(HCA_SCHEDULE).sort();
const todayD = (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();
let who = HCAS[0], view = "week", cur = new Date(todayD);
const sunOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
const md = d => (d.getMonth()+1) + "/" + d.getDate();
const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);

function renderJump(){
  const s0 = sunOf(todayD), cs = sunOf(cur).getTime();
  $("jump").innerHTML = [0,1,2,3].map(i => { const s = addD(s0, 7*i);
    return `<button type="button" data-w="${i}" class="${s.getTime()===cs?"on":""}">${i===0?"This week":i===1?"Next week":"Week of "+md(s)}</button>`; }).join("");
  $("jump").querySelectorAll("button").forEach(b => b.onclick = () => { cur = addD(sunOf(todayD), 7*Number(b.dataset.w)); render(); });
}
function renderWeek(){
  const p = HCA_SCHEDULE[who], s = sunOf(cur);
  $("title").textContent = "Week of Sun " + md(s) + " – Sat " + md(addD(s,6));
  if(addD(s,6) < SCHED_ANCHOR){ $("body").innerHTML = '<div class="foot">This schedule starts the week of Sun 9/27/26.</div>'; return; }
  let head = "", row = "", total = 0, rides = [], meets = [];
  for(let i=0;i<7;i++){ const d = addD(s,i), isT = d.getTime() === todayD.getTime();
    head += `<th class="${isT?"today":""}">${DAY_NAMES[i].slice(0,3)}<span>${md(d)}</span></th>`;
    if(d < SCHED_ANCHOR){ row += `<td><div class="cell off">–<small>Before new schedule</small></div></td>`; continue; }
    const c = packetCell(p, d); total += c.book;
    if(c.kind === "ride") rides.push(DAY_NAMES[i].slice(0,3));
    const body = c.kind === "sell" ? `<span class="dot">●</span>` : esc(c.text).replace(/ \+ /g, "<br>");
    const slots = c.kind === "off" ? (c.sub ? `<small>${esc(c.sub)}</small>` : "") : `<span class="slots">${c.book} slot${c.book===1?"":"s"}</span>`;
    row += `<td><div class="cell ${c.kind}${isT?" today":""}" role="button" tabindex="0" data-i="${i}" aria-label="Open ${DAY_NAMES[i]} ${md(d)}">${body}${c.sub && c.kind!=="off" ? `<small>${esc(c.sub)}</small>` : ""}${slots}</div></td>`;
  }
  const pe = schedFor(p, s.getTime() < SCHED_ANCHOR.getTime() ? SCHED_ANCHOR : addD(s,3));
  const techs = pe.techs.map(t => t[1] ? `<b>${esc(t[0])}</b>` : esc(t[0])).join(", ");
  $("body").innerHTML = `<table class="wk"><thead><tr>${head}</tr></thead><tbody><tr>${row}</tr></tbody></table>
    <div class="legend"><span><i style="border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.1)"></i>● Selling</span><span><i style="border-color:rgba(59,130,246,.75);background:rgba(59,130,246,.3)"></i>R = tech ride</span><span><i style="border-color:rgba(201,125,16,.7);background:rgba(201,125,16,.25)"></i>MTG / 1:1</span><span>– Off · tap a day to open it</span></div>
    <div class="sum"><div class="metric"><strong>${total}</strong><span>Consults bookable this week</span></div>
    <div>Shift <b>${schedClock(pe.sh[0])}–${schedClock(pe.sh[1])}</b> · Rotation week <b>${schedWeek(addD(s,3))+1}</b><br>Paired techs (bold = primary): ${techs}</div></div>`;
  $("body").querySelectorAll(".cell[data-i]").forEach(el => { const go = () => { cur = addD(s, Number(el.dataset.i)); setView("day"); };
    el.onclick = go; el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }; });
}
function renderDay(){
  const p = HCA_SCHEDULE[who], d = cur;
  $("title").textContent = DAY_NAMES[d.getDay()] + " " + md(d);
  if(d < SCHED_ANCHOR){ $("body").innerHTML = '<div class="foot">This schedule starts the week of Sun 9/27/26.</div>'; return; }
  const pe = schedFor(p, d), pl = schedPlan(pe, d), pct = h => ((h-7)/12*100).toFixed(3) + "%";
  const bl = []; pl.blocks.forEach(b => { if(b[3] === "SALES MEETING + 1:1 9:00") bl.push([b[0],9,b[2],"MTG 8:00"],[9,b[1],b[2],"1:1 9:00"]); else bl.push(b); });
  const axis = [7,9,11,13,15,17,19].map(h => `<span style="left:${pct(h)}">${h>12?h-12:h}${h>=12?"p":"a"}</span>`).join("");
  const bars = bl.map(b => `<div class="sb ${b[2]}" style="left:calc(${pct(b[0])} + 2px);width:calc(${((b[1]-b[0])/12*100).toFixed(3)}% - 4px)">${esc(b[3])}</div>`).join("");
  const dow = d.getDay();
  const techs = !pl.sh ? "—" : !pe.techs.length ? "Overflow and unpaired leads."
    : (pe.techs.filter(t => (TECH_DAYS[t[0]]||[]).indexOf(dow) >= 0).map(t => `<b>${esc(t[0])}</b> ${t[1] ? "(primary)" : "(secondary)"}`).join(" · ") || "None of your paired techs work today.");
  $("body").innerHTML = `<div class="axis">${axis}</div><div class="track">${bars}</div>
    <div class="plan"><div class="lines">${pl.lines.join("<br>")}</div>
    <div class="metric" style="min-width:110px"><strong>${pl.book}</strong><span>Consults bookable</span></div>
    <div class="techs">${pl.sh ? `On shift ${schedClock(pl.sh[0])}–${schedClock(pl.sh[1])} · ` : ""}Rotation week ${schedWeek(d)+1}<br>Your techs working: ${techs}</div></div>`;
}
function setView(v){ view = v;
  [["vDay","day"],["vWeek","week"]].forEach(([id,val]) => { $(id).className = v===val ? "on" : ""; $(id).setAttribute("aria-pressed", v===val); });
  $("tag").textContent = v === "week" ? "Planned week" : "Planned day";
  $("prev").setAttribute("aria-label", v==="week" ? "Previous week" : "Previous day");
  $("next").setAttribute("aria-label", v==="week" ? "Next week" : "Next day");
  render(); }
function render(){ renderJump(); view === "week" ? renderWeek() : renderDay(); }
$("who").innerHTML = HCAS.map(n => `<option>${esc(n)}</option>`).join("");
$("who").onchange = e => { who = e.target.value; render(); };
$("prev").onclick = () => { cur = addD(cur, view==="week" ? -7 : -1); render(); };
$("next").onclick = () => { cur = addD(cur, view==="week" ? 7 : 1); render(); };
$("today").onclick = () => { cur = new Date(todayD); render(); };
$("vDay").onclick = () => setView("day");
$("vWeek").onclick = () => setView("week");
setView("week");
</script></body></html>
