<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Follow-Up Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1a;--surface:#111827;--surface2:#1a2336;
  --orange:#f97316;--gold:#fbbf24;--silver:#94a3b8;--bronze:#cd7c2f;
  --white:#f8fafc;--muted:#64748b;--green:#22c55e;--blue:#38bdf8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--white);height:100vh;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(249,115,22,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(249,115,22,.04) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;}
.app{display:flex;flex-direction:column;height:100vh;padding:18px 32px 14px;gap:14px;}
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.header-left{display:flex;align-items:center;gap:18px;}
.header-left img{height:48px;display:block;}
.logo-text{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:white;letter-spacing:1px;display:none;}
.title h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;text-transform:uppercase;letter-spacing:3px;line-height:1;}
.title .sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
.header-right{display:flex;align-items:center;gap:14px;}
.live-badge{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#475569;box-shadow:none;}
.live-dot.active{background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 2s infinite;}
.live-text{color:var(--muted);}
.live-text.active{color:var(--green);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.toggle{display:flex;background:var(--surface);border-radius:8px;padding:4px;gap:4px;}
.toggle-btn{padding:7px 20px;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;background:transparent;color:var(--muted);}
.toggle-btn.active{background:var(--orange);color:white;}
.view{display:none;flex:1;overflow:hidden;}
.view.active{display:flex;}
.board-view{flex-direction:row;gap:18px;}
.left-col{flex:1.3;display:flex;flex-direction:column;gap:10px;}
.right-col{flex:1;display:flex;flex-direction:column;gap:7px;justify-content:center;}
.rank-1{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(249,115,22,.06));border:1px solid rgba(251,191,36,.25);border-radius:12px;padding:20px 26px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;animation:slideR .5s ease both;}
.rank-1::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--orange));}
.rank-2,.rank-3{background:var(--surface);border:1px solid var(--surface2);border-radius:12px;display:flex;align-items:center;gap:18px;padding:14px 22px;animation:slideR .5s ease both;}
.rank-2{animation-delay:.1s;}.rank-3{animation-delay:.2s;}
@keyframes slideR{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.crown{font-size:30px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.medal{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:900;min-width:52px;text-align:center;line-height:1;}
.rank-2 .medal{color:var(--silver);}.rank-3 .medal{color:var(--bronze);}
.card-info{flex:1;}
.card-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:1px;line-height:1;}
.rank-1 .card-name{font-size:38px;}.rank-2 .card-name,.rank-3 .card-name{font-size:28px;}
.card-stats{display:flex;gap:16px;margin-top:5px;}
.card-stat{font-size:12px;color:var(--muted);font-weight:500;}
.card-stat strong{color:var(--white);font-weight:700;}
.card-pts{font-family:'Barlow Condensed',sans-serif;font-weight:900;line-height:1;text-align:right;}
.rank-1 .card-pts{font-size:52px;color:var(--gold);}
.rank-2 .card-pts{font-size:40px;color:var(--silver);}.rank-3 .card-pts{font-size:40px;color:var(--bronze);}
.pts-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:right;margin-top:2px;font-weight:600;}
.rank-row{background:var(--surface);border:1px solid var(--surface2);border-radius:8px;padding:10px 18px;display:flex;align-items:center;gap:14px;animation:slideR .4s ease both;}
.row-num{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--muted);min-width:26px;text-align:center;}
.row-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex:1;}
.row-stats{display:flex;gap:12px;}
.row-stat{font-size:11px;color:var(--muted);}
.row-stat strong{color:var(--white);}
.row-bar-wrap{flex:1.5;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.row-bar{height:100%;border-radius:3px;}
.row-pts{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--orange);min-width:70px;text-align:right;}
.scoring-note{flex-shrink:0;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.5px;padding-top:2px;}
.countdown{position:fixed;bottom:12px;right:22px;display:flex;gap:4px;align-items:center;}
.cd-dot{width:6px;height:6px;border-radius:50%;background:var(--surface2);transition:background .3s;}
.cd-dot.on{background:var(--orange);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <img src="https://cmheating.github.io/sales-tools/cm-logo.webp" alt="CM Heating" id="logoImg">
      <span class="logo-text" id="logoFallback">CM Heating</span>
      <div class="title">
        <h1>Follow-Up Leaderboard</h1>
        <div class="sub" id="subLabel"></div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge">
        <div class="live-dot" id="liveDot"></div>
        <span class="live-text" id="liveText">Loading...</span>
      </div>
      <div class="toggle">
        <button class="toggle-btn active" onclick="switchView('ytd',this)">YTD Total</button>
        <button class="toggle-btn" onclick="switchView('rolling90',this)">Rolling 90-Day</button>
      </div>
    </div>
  </div>

  <div id="ytd-view" class="view board-view active">
    <div class="left-col" id="ytd-podium"></div>
    <div class="right-col" id="ytd-lower"></div>
  </div>
  <div id="rolling90-view" class="view board-view">
    <div class="left-col" id="r90-podium"></div>
    <div class="right-col" id="r90-lower"></div>
  </div>

  <div class="scoring-note">Points: 10 per follow-up attempt &nbsp;·&nbsp; 20 per documented lead &nbsp;·&nbsp; 15 per resolved/dismissed lead &nbsp;·&nbsp; <span id="lastUpdated"></span></div>
</div>
<div class="countdown" id="countdown"></div>

<script>
const AGGREGATOR_URL = 'https://script.google.com/macros/s/AKfycbzadkmyc4WzBzW5da2PN2Ib8XNGmHLBQILAr7bdL98CV6QwU_9vXyVXJ9PvOPoZCuVG/exec';

const HCA_COLORS = {"Amber":"#f472b6","Chester":"#a78bfa","Davis":"#34d399","Jay":"#38bdf8","Joe":"#fb923c","Joseph":"#fbbf24","Kyle":"#4ade80","Samir":"#e879f9","Trevor":"#67e8f9"};

let stats = {"Amber":{"ytd":{"attempts":51,"documented":43,"leads":41,"dismissed":19,"pipeline":1344563,"pts":1655},"rolling90":{"attempts":31,"documented":30,"leads":28,"dismissed":13,"pipeline":1003349,"pts":1105}},"Chester":{"ytd":{"attempts":86,"documented":60,"leads":75,"dismissed":0,"pipeline":1447897,"pts":2060},"rolling90":{"attempts":71,"documented":49,"leads":60,"dismissed":0,"pipeline":1246564,"pts":1690}},"Davis":{"ytd":{"attempts":17,"documented":15,"leads":53,"dismissed":17,"pipeline":1219864,"pts":725},"rolling90":{"attempts":9,"documented":9,"leads":41,"dismissed":8,"pipeline":856421,"pts":390}},"Jay":{"ytd":{"attempts":19,"documented":17,"leads":69,"dismissed":4,"pipeline":1161076,"pts":590},"rolling90":{"attempts":7,"documented":6,"leads":50,"dismissed":2,"pipeline":879353,"pts":220}},"Joe":{"ytd":{"attempts":2,"documented":2,"leads":63,"dismissed":3,"pipeline":1094804,"pts":105},"rolling90":{"attempts":2,"documented":2,"leads":46,"dismissed":3,"pipeline":787042,"pts":105}},"Joseph":{"ytd":{"attempts":0,"documented":0,"leads":80,"dismissed":0,"pipeline":1509767,"pts":0},"rolling90":{"attempts":0,"documented":0,"leads":56,"dismissed":0,"pipeline":1075055,"pts":0}},"Kyle":{"ytd":{"attempts":38,"documented":26,"leads":49,"dismissed":14,"pipeline":1148813,"pts":1110},"rolling90":{"attempts":22,"documented":17,"leads":34,"dismissed":8,"pipeline":813344,"pts":680}},"Samir":{"ytd":{"attempts":26,"documented":21,"leads":63,"dismissed":2,"pipeline":1036425,"pts":710},"rolling90":{"attempts":12,"documented":10,"leads":40,"dismissed":0,"pipeline":644862,"pts":320}},"Trevor":{"ytd":{"attempts":55,"documented":36,"leads":21,"dismissed":17,"pipeline":825875,"pts":1525},"rolling90":{"attempts":55,"documented":36,"leads":21,"dismissed":17,"pipeline":825875,"pts":1525}}};

document.getElementById('logoImg').onerror = function() {
  this.style.display = 'none';
  document.getElementById('logoFallback').style.display = 'block';
};

function ranked(period) {
  return Object.entries(stats)
    .filter(([k]) => k !== '_updated')
    .map(([name, s]) => ({ name, ...s[period] }))
    .sort((a,b) => b.pts - a.pts);
}

function fmtPipeline(v) {
  if (!v) return '$0';
  if(v >= 1000000) return '$'+(v/1000000).toFixed(1)+'M';
  if(v >= 1000) return '$'+Math.round(v/1000)+'K';
  return '$'+v;
}

function renderBoard(period) {
  const r = ranked(period);
  const maxPts = r[0] ? r[0].pts || 1 : 1;
  const podiumId = period==='ytd' ? 'ytd-podium' : 'r90-podium';
  const lowerId  = period==='ytd' ? 'ytd-lower'  : 'r90-lower';

  document.getElementById(podiumId).innerHTML = r.slice(0,3).map((h,i) => {
    const cls = ['rank-1','rank-2','rank-3'][i];
    const medal = i===0 ? '<div class="crown">\ud83d\udc51</div>' : '<div class="medal">'+(i+1)+'</div>';
    const ptsColor = i===0?'var(--gold)':i===1?'var(--silver)':'var(--bronze)';
    return '<div class="'+cls+'">'+medal+'<div class="card-info"><div class="card-name" style="color:'+( HCA_COLORS[h.name]||'var(--white)')+'">'+h.name+'</div><div class="card-stats"><div class="card-stat">Attempts: <strong>'+(h.attempts||0)+'</strong></div><div class="card-stat">Documented: <strong>'+(h.documented||0)+'</strong></div><div class="card-stat">Resolved: <strong>'+(h.dismissed||0)+'</strong></div><div class="card-stat">Pipeline: <strong>'+fmtPipeline(h.pipeline)+'</strong></div></div></div><div><div class="card-pts" style="color:'+ptsColor+'">'+(h.pts||0)+'</div><div class="pts-lbl">points</div></div></div>';
  }).join('');

  document.getElementById(lowerId).innerHTML = r.slice(3).map((h,i) =>
    '<div class="rank-row"><div class="row-num">'+(i+4)+'</div><div class="row-name" style="color:'+(HCA_COLORS[h.name]||'var(--white)')+'">'+h.name+'</div><div class="row-stats"><div class="row-stat">Att: <strong>'+(h.attempts||0)+'</strong></div><div class="row-stat">Doc: <strong>'+(h.documented||0)+'</strong></div></div><div class="row-bar-wrap"><div class="row-bar" style="width:'+Math.round(((h.pts||0)/maxPts)*100)+'%;background:'+(HCA_COLORS[h.name]||'var(--orange)')+'"></div></div><div class="row-pts">'+(h.pts||0)+'</div></div>'
  ).join('');
}

function setLabel(period) {
  const now = new Date();
  const ytdStart = new Date('2026-01-01');
  const r90Start = new Date(now.getTime() - 90*24*60*60*1000);
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('subLabel').textContent = period==='ytd'
    ? 'Year to Date \u2014 '+fmt(ytdStart)+' through '+fmt(now)
    : 'Rolling 90-Day \u2014 '+fmt(r90Start)+' through '+fmt(now);
}

function fetchLive() {
  fetch(AGGREGATOR_URL)
    .then(r => r.json())
    .then(data => {
      stats = data;
      renderBoard('ytd');
      renderBoard('rolling90');
      document.getElementById('liveDot').classList.add('active');
      document.getElementById('liveText').classList.add('active');
      document.getElementById('liveText').textContent = 'Live';
      const updated = data._updated ? new Date(data._updated) : new Date();
      document.getElementById('lastUpdated').textContent =
        'Live data as of ' + updated.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    })
    .catch(() => {
      document.getElementById('liveText').textContent = 'Offline \u2014 showing last rebuild';
    });
}

fetchLive();
setInterval(fetchLive, 5 * 60 * 1000);

let currentView = 'ytd';
function switchView(name, btn) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(name+'-view').classList.add('active');
  if(btn) btn.classList.add('active');
  currentView = name;
  setLabel(name);
  resetCycle();
}

const CYCLE = 15;
let dotTimer, elapsed = 0;
function buildDots() {
  document.getElementById('countdown').innerHTML =
    Array.from({length:CYCLE},(_,i)=>'<div class="cd-dot" id="d'+i+'"></div>').join('');
}
function resetCycle() {
  clearInterval(dotTimer); elapsed = 0; buildDots(); startCycle();
}
function startCycle() {
  dotTimer = setInterval(function(){
    var dot = document.getElementById('d'+elapsed);
    if(dot) dot.classList.add('on');
    elapsed++;
    if(elapsed >= CYCLE) {
      clearInterval(dotTimer);
      var next = currentView==='ytd' ? 'rolling90' : 'ytd';
      var btn = Array.from(document.querySelectorAll('.toggle-btn'))
        .find(function(b){ return b.textContent.toLowerCase().indexOf(next==='ytd'?'ytd':'rolling') !== -1; });
      switchView(next, btn);
    }
  }, 1000);
}

renderBoard('ytd');
renderBoard('rolling90');
setLabel('ytd');
buildDots();
startCycle();
</script>
</body>
</html>
