<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Daily 1-on-1 Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 32px;
  font-size: 14px;
}
.page-header {
  background: var(--surface);
  border-radius: 12px;
  padding: 24px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.page-header img { height: 48px; }
.page-header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.page-header-date {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 4px;
}
.print-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}
.selector-bar {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 24px;
  margin-bottom: 24px;
  display: flex;
  gap: 16px;
  align-items: center;
}
.selector-label {
  font-weight: 600;
  color: var(--dark);
  font-size: 14px;
}
.hca-select {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  color: var(--dark);
  background: var(--white);
  cursor: pointer;
  min-width: 200px;
  transition: border-color 0.2s;
}
.hca-select:hover { border-color: var(--orange); }
.hca-select:focus { outline: none; border-color: var(--orange); }
.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  max-width: 600px;
  gap: 16px;
}
.hca-brief {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.brief-header {
  background: var(--surface);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brief-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
}
.brief-pts {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--orange);
}
.brief-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-bottom: 1px solid var(--border);
}
.brief-stat {
  padding: 12px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.brief-stat:nth-child(even) { border-right: none; }
.stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 3px;
}
.orange { color: var(--orange); }

.brief-leads {
  padding: 12px 18px;
}
.leads-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.lead-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid #f8fafc;
  font-size: 12px;
}
.lead-row:last-child { border-bottom: none; }
.urgency-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-orange { background: var(--orange); }
.dot-red { background: var(--red); }
.lead-name {
  flex: 1;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lead-days {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
.lead-amount {
  font-size: 12px;
  font-weight: 600;
  color: var(--dark);
  white-space: nowrap;
}

.brief-talking {
  background: #f8fafc;
  border-top: 1px solid var(--border);
  padding: 12px 18px;
}
.talking-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.talking-point {
  font-size: 12px;
  color: var(--dark);
  line-height: 1.5;
  padding: 3px 0;
  padding-left: 12px;
  position: relative;
}
.talking-point::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--orange);
  font-weight: 700;
}

@media print {
  body { padding: 16px; background: white; }
  .print-btn { display: none; }
  .selector-bar { display: none; }
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}
</style>
</head>
<body>

  <div>
    <div class="page-header-title">Daily 1-on-1 Brief</div>
    <div class="page-header-date" id="dateLabel"></div>
  </div>
  <button class="print-btn" onclick="window.print()">⎙ Print / Save PDF</button>
</div>

<div class="selector-bar">
  <label class="selector-label">Focus on HCA:</label>
  <select class="hca-select" id="hcaSelector" onchange="selectHCA(this.value)">
    <option value="">Pick a team member</option>
  </select>
</div>

<div class="cards-grid" id="cards"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxX2VPLE9LG127so1PLk_dziaXoXpmSXAUJdU-66u9ZXM66A8w2WwG5fJ_SLxDXNq6/exec';

let allLeads = [];
let selectedHCA = '';

function getUrgencyClass(daysOld) {
  if (daysOld <= 3) return 'dot-green';
  if (daysOld <= 7) return 'dot-yellow';
  if (daysOld <= 14) return 'dot-orange';
  return 'dot-red';
}

function formatCurrency(n) {
  if (!n) return '$0';
  if (n >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n/1000) + 'K';
  return '$' + Math.round(n);
}

async function loadData() {
  try {
    const response = await fetch(API_URL);
    allLeads = await response.json();
    
    document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    
    populateSelector();
  } catch (err) {
    console.error('Failed to load data:', err);
    document.getElementById('cards').innerHTML = '<div class="loading">Failed to load brief data</div>';
  }
}

function populateSelector() {
  const hcaNames = [...new Set(allLeads.map(l => l.hca))].sort();
  const selector = document.getElementById('hcaSelector');
  
  hcaNames.forEach(hca => {
    const option = document.createElement('option');
    option.value = hca;
    option.textContent = hca;
    selector.appendChild(option);
  });
}

function selectHCA(hca) {
  selectedHCA = hca;
  renderCards();
}

function renderCards() {
  const cardsEl = document.getElementById('cards');
  
  // If no HCA selected, show nothing
  if (!selectedHCA) {
    cardsEl.innerHTML = '';
    return;
  }
  
  const hcaLeads = allLeads.filter(l => l.hca === selectedHCA).sort((a, b) => (b.daysOld || 0) - (a.daysOld || 0));
  const attempts = hcaLeads.reduce((s, l) => s + (l.attempts || 0), 0);
  const oldestFour = hcaLeads.slice(0, 4);
  
  cardsEl.innerHTML = `
    <div class="hca-brief">
      <div class="brief-header">
        <div class="brief-name">${selectedHCA}</div>
        <div class="brief-pts">${attempts} att</div>
      </div>
      <div class="brief-stats">
        <div class="brief-stat">
          <div class="stat-val orange">${hcaLeads.length}</div>
          <div class="stat-lbl">Open Leads</div>
        </div>
        <div class="brief-stat">
          <div class="stat-val orange">${attempts}</div>
          <div class="stat-lbl">Attempts</div>
        </div>
      </div>
      ${oldestFour.length > 0 ? `
      <div class="brief-leads">
        <div class="leads-title">Oldest Open Leads</div>
        ${oldestFour.map(l => `
          <div class="lead-row">
            <div class="urgency-dot ${getUrgencyClass(l.daysOld || 0)}"></div>
            <div class="lead-name">${l.customer}</div>
            <div class="lead-days">${Math.round(l.daysOld || 0)}d</div>
            <div class="lead-amount">${formatCurrency(l.estValue)}</div>
          </div>
        `).join('')}
      </div>` : ''}
      <div class="brief-talking">
        <div class="talking-title">Key Points</div>
        <div class="talking-point">${hcaLeads.length} open leads · Review urgency</div>
        <div class="talking-point">${attempts} follow-up attempts this week</div>
        <div class="talking-point">Focus on leads 14+ days old</div>
      </div>
    </div>`;
}

loadData();
</script>
</body>
</html>
