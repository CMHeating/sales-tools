<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Daily 1-on-1 Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 32px;
  font-size: 14px;
  background-image: url('https://cmheating.github.io/sales-tools/cm-logo.webp');
  background-size: 200px;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
.page-header {
  background: var(--surface);
  border-radius: 12px;
  padding: 24px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  width: 100%;
  max-width: 1200px;
}
.page-header img { height: 48px; }
.page-header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.page-header-date {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 4px;
}
.controls {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 28px;
}
.selector {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.selector-label {
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.selector-dropdown {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 600;
  background: white;
  color: var(--dark);
  cursor: pointer;
  min-width: 200px;
}
.selector-dropdown:hover {
  border-color: var(--orange);
  background: #f8fafc;
}
.reset-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
}
.reset-btn:hover { opacity: 0.85; }
.reset-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  text-align: center;
  gap: 20px;
}
.empty-state-icon {
  font-size: 64px;
  opacity: 0.2;
}
.empty-state-text {
  font-size: 18px;
  color: var(--muted);
  font-weight: 500;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  width: 100%;
  max-width: 1200px;
}
.hca-brief {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  display: none;
}
.hca-brief.active { display: block; }
.brief-header {
  background: var(--surface);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brief-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
}
.brief-pts {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--orange);
}
.brief-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border);
}
.brief-stat {
  padding: 12px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.brief-stat:last-child { border-right: none; }
.stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 3px;
}
.green { color: var(--green); }
.yellow { color: var(--yellow); }
.red { color: var(--red); }
.blue { color: var(--blue); }
.orange { color: var(--orange); }
.brief-leads {
  padding: 12px 18px;
}
.leads-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.lead-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid #f8fafc;
}
.lead-row:last-child { border-bottom: none; }
.urgency-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-orange { background: #f97316; }
.dot-red { background: var(--red); }
.lead-name {
  flex: 1;
  font-weight: 500;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lead-days {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
.lead-amount {
  font-size: 12px;
  font-weight: 600;
  color: var(--dark);
  white-space: nowrap;
}
.brief-talking {
  background: #f8fafc;
  border-top: 1px solid var(--border);
  padding: 12px 18px;
}
.talking-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.talking-point {
  font-size: 12px;
  color: var(--dark);
  line-height: 1.5;
  padding: 3px 0;
  padding-left: 12px;
  position: relative;
}
.talking-point::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--orange);
  font-weight: 700;
}
@media print {
  body { padding: 16px; background: white; }
  .page-header { position: sticky; top: 0; }
  .controls { position: sticky; top: 0; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="page-header">
  <div>
    <img src="https://cmheating.github.io/sales-tools/cm-logo.webp" alt="CM Heating">
  </div>
  <div>
    <div class="page-header-title">Daily 1-on-1 Brief</div>
    <div class="page-header-date" id="dateLabel"></div>
  </div>
</div>

<div class="controls">
  <div class="selector">
    <label class="selector-label">Select HCA</label>
    <select class="selector-dropdown" id="hcaSelect">
      <option value="">-- Choose an HCA --</option>
      <option value="Amber">Amber Maddalena</option>
      <option value="Chester">Chester Granard</option>
      <option value="Davis">Davis Diosdado</option>
      <option value="Jay">Javierre Milo</option>
      <option value="Joe">Joe Chounramany</option>
      <option value="Joseph">Joseph Ruble</option>
      <option value="Kyle">Kyle McAlister</option>
      <option value="Samir">Samir Khoury</option>
      <option value="Trevor">Trevor Bohm</option>
    </select>
  </div>
  <button class="reset-btn" id="resetBtn" disabled>Reset</button>
</div>

<div id="emptyState" class="empty-state">
  <div class="empty-state-icon">👥</div>
  <div class="empty-state-text">Select an HCA to view their brief</div>
</div>

<div class="cards-grid" id="cardsGrid"></div>

<script>
const briefData = {
  Amber:   { attempts:8,  documented:7,  conversions:1, totalLeads:11,
    leads:[
      {name:'Han Lin',days:25,amount:'$24,750',urgency:'red'},
      {name:'Adam Ismail',days:10,amount:'$25,297',urgency:'orange'},
      {name:'Sri Hari Ravindran',days:5,amount:'$23,771',urgency:'yellow'},
      {name:'Matt Larrick',days:3,amount:'$18,633',urgency:'green'},
    ],
    talking:[
      'Han Lin is 25 days old — what is the real objection?',
      'Documentation rate 88% — strong, keep it up',
      '1 conversion this week — what moved them?',
    ]
  },
  Chester: { attempts:14, documented:10, conversions:2, totalLeads:24,
    leads:[
      {name:'Vinit Ogale',days:75,amount:'$23,187',urgency:'red'},
      {name:'Shawn Pate',days:86,amount:'$27,100',urgency:'red'},
      {name:'Bill & Chris Olson',days:37,amount:'$18,808',urgency:'red'},
      {name:'Rex Wiegand',days:28,amount:'$20,971',urgency:'red'},
    ],
    talking:[
      '4 leads 28+ days — need a close or cut conversation',
      'Highest attempts on team — acknowledge the effort',
      'Doc rate 71% — gap between attempts and docs',
    ]
  },
  Davis:   { attempts:6,  documented:4,  conversions:0, totalLeads:16,
    leads:[
      {name:'Andrew Sale',days:29,amount:'$20,316',urgency:'red'},
      {name:'Asrat Damena',days:26,amount:'$17,068',urgency:'red'},
      {name:'Craig Bernhard',days:22,amount:'$24,465',urgency:'red'},
      {name:'Jonas Malm',days:22,amount:'$12,924',urgency:'red'},
    ],
    talking:[
      '0 conversions — explore what objections keep coming up',
      'Doc rate 67% — 2 attempts not logged',
      'Several critical leads — needs a reset strategy call',
    ]
  },
  Jay:     { attempts:12, documented:11, conversions:2, totalLeads:18,
    leads:[
      {name:'Ethan Hemmati',days:26,amount:'$11,757',urgency:'red'},
      {name:'Tom Davis',days:27,amount:'$21,070',urgency:'red'},
      {name:'Cherie & Tony Finazzo',days:21,amount:'$17,422',urgency:'red'},
      {name:'Min & Patrick Sue',days:21,amount:'$21,017',urgency:'red'},
    ],
    talking:[
      'Best doc rate on team at 92% — highlight for the group',
      '2 conversions matches Chester for team lead',
      'Several older leads — are these dead or still alive?',
    ]
  },
  Joe:     { attempts:5,  documented:3,  conversions:1, totalLeads:10,
    leads:[
      {name:'Wayne Ho',days:24,amount:'$26,001',urgency:'red'},
      {name:'Payton Parkerson',days:17,amount:'$15,799',urgency:'red'},
      {name:'Michael Klein',days:17,amount:'$13,845',urgency:'red'},
      {name:'Mykenzie Hering',days:12,amount:'$24,878',urgency:'orange'},
    ],
    talking:[
      'Doc rate 60% — 2 attempts not documented',
      'Wayne Ho at $26K — 24 days, what is the status?',
      '1 conversion — what was the winning factor?',
    ]
  },
  Joseph:  { attempts:9,  documented:8,  conversions:1, totalLeads:13,
    leads:[
      {name:'Vivek Kumar',days:26,amount:'$19,704',urgency:'red'},
      {name:'Angela Pfleiderer',days:26,amount:'$43,466',urgency:'red'},
      {name:'Rebecca Carbajal',days:24,amount:'$26,523',urgency:'red'},
      {name:'Teresa Robertson',days:24,amount:'$18,093',urgency:'red'},
    ],
    talking:[
      'Angela Pfleiderer at $43K — highest single value, what is the status?',
      'Doc rate 89% — excellent accountability',
      '4 critical leads need resolution this week',
    ]
  },
  Kyle:    { attempts:11, documented:9,  conversions:1, totalLeads:16,
    leads:[
      {name:'David Delgado',days:53,amount:'$15,792',urgency:'red'},
      {name:'Nancy Lam',days:53,amount:'$14,931',urgency:'red'},
      {name:'Anita Farris',days:36,amount:'$21,614',urgency:'red'},
      {name:'Marjorie Forbes',days:37,amount:'$7,178',urgency:'red'},
    ],
    talking:[
      'David Delgado & Nancy Lam at 53 days — close or cut',
      'Doc rate 82% — solid, 2 more entries would be perfect',
      'Most leads on team — review pipeline size vs capacity',
    ]
  },
  Samir:   { attempts:4,  documented:2,  conversions:0, totalLeads:0,
    leads:[],
    talking:[
      'No leads in current unsold report — new to pipeline',
      'Set expectations for logging from day one',
      'Check in on ServiceTitan activity this week',
    ]
  },
  Trevor:  { attempts:7,  documented:6,  conversions:1, totalLeads:7,
    leads:[
      {name:'Corey Hansen',days:29,amount:'$16,389',urgency:'red'},
      {name:'Kushal Kewlani',days:24,amount:'$18,017',urgency:'red'},
      {name:'Aaron Schlund',days:11,amount:'$26,798',urgency:'orange'},
      {name:'Kevin & Diana Boyle',days:10,amount:'$23,054',urgency:'orange'},
    ],
    talking:[
      'Doc rate 86% — strong habits forming',
      'Corey Hansen 29 days — needs a final push or close',
      'Kevin & Diana Boyle at $23K — in hot window, push now',
    ]
  },
};

function calcPts(d) {
  return (d.conversions * 100) + (d.documented * 20) + (d.attempts * 10);
}
function convRate(d){ return d.totalLeads>0 ? Math.round((d.conversions/d.totalLeads)*100) : 0; }
function docRate(d) { return d.attempts>0   ? Math.round((d.documented/d.attempts)*100)   : 0; }
function getDotClass(urgency) { return `dot-${urgency}`; }
function getStatColor(val, type) {
  if(type==='conv') return val >= 10 ? 'green' : val > 0 ? 'yellow' : 'red';
  if(type==='doc')  return val >= 80 ? 'green' : val >= 60 ? 'yellow' : 'red';
  if(type==='att')  return val >= 8  ? 'green' : val >= 4  ? 'yellow' : 'red';
  return 'blue';
}

document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

const select = document.getElementById('hcaSelect');
const resetBtn = document.getElementById('resetBtn');
const emptyState = document.getElementById('emptyState');
const cardsGrid = document.getElementById('cardsGrid');

Object.entries(briefData).forEach(([name, d]) => {
  const conv = convRate(d);
  const doc = docRate(d);
  const pts = calcPts(d);
  const card = document.createElement('div');
  card.className = 'hca-brief';
  card.id = `card-${name}`;
  card.innerHTML = `
    <div class="brief-header">
      <div class="brief-name">${name}</div>
      <div class="brief-pts">${pts} pts</div>
    </div>
    <div class="brief-stats">
      <div class="brief-stat">
        <div class="stat-val ${getStatColor(conv,'conv')}">${conv}%</div>
        <div class="stat-lbl">Conv Rate</div>
      </div>
      <div class="brief-stat">
        <div class="stat-val ${getStatColor(doc,'doc')}">${doc}%</div>
        <div class="stat-lbl">Doc Rate</div>
      </div>
      <div class="brief-stat">
        <div class="stat-val ${getStatColor(d.attempts,'att')}">${d.attempts}</div>
        <div class="stat-lbl">Attempts</div>
      </div>
    </div>
    ${d.leads.length > 0 ? `
    <div class="brief-leads">
      <div class="leads-title">Oldest Open Leads</div>
      ${d.leads.map(l=>`
        <div class="lead-row">
          <div class="urgency-dot ${getDotClass(l.urgency)}"></div>
          <div class="lead-name">${l.name}</div>
          <div class="lead-days">${l.days}d</div>
          <div class="lead-amount">${l.amount}</div>
        </div>
      `).join('')}
    </div>` : `<div class="brief-leads"><div class="leads-title">No open leads this week</div></div>`}
    <div class="brief-talking">
      <div class="talking-title">Talking Points</div>
      ${d.talking.map(t=>`<div class="talking-point">${t}</div>`).join('')}
    </div>
  `;
  cardsGrid.appendChild(card);
});

select.addEventListener('change', (e) => {
  if (e.target.value) {
    document.querySelectorAll('.hca-brief').forEach(c => c.classList.remove('active'));
    document.getElementById(`card-${e.target.value}`).classList.add('active');
    emptyState.style.display = 'none';
    resetBtn.disabled = false;
  }
});

resetBtn.addEventListener('click', () => {
  select.value = '';
  document.querySelectorAll('.hca-brief').forEach(c => c.classList.remove('active'));
  emptyState.style.display = 'flex';
  resetBtn.disabled = true;
});
</script>
</body>
</html>
