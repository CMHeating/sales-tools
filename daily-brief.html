<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 32px;
  font-size: 14px;
}
.page-header {
  background: var(--surface);
  border-radius: 12px;
  padding: 24px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.page-header img { height: 48px; }
.page-header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.page-header-date {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 4px;
}
.print-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.hca-brief {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.brief-header {
  background: var(--surface);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brief-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
}
.brief-pts {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--orange);
}
.brief-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border);
}
.brief-stat {
  padding: 12px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.brief-stat:last-child { border-right: none; }
.stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 3px;
}
.green { color: var(--green); }
.yellow { color: var(--yellow); }
.red { color: var(--red); }
.blue { color: var(--blue); }
.orange { color: var(--orange); }
.brief-leads {
  padding: 12px 18px;
}
.leads-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.lead-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid #f8fafc;
}
.lead-row:last-child { border-bottom: none; }
.urgency-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-orange { background: #f97316; }
.dot-red { background: var(--red); }
.lead-name {
  flex: 1;
  font-weight: 500;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lead-days {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
.lead-amount {
  font-size: 12px;
  font-weight: 600;
  color: var(--dark);
  white-space: nowrap;
}
.brief-talking {
  background: #f8fafc;
  border-top: 1px solid var(--border);
  padding: 12px 18px;
}
.talking-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.talking-point {
  font-size: 12px;
  color: var(--dark);
  line-height: 1.5;
  padding: 3px 0;
  padding-left: 12px;
  position: relative;
}
.talking-point::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--orange);
  font-weight: 700;
}
@media print {
  body { padding: 16px; background: white; }
  .print-btn { display: none; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

// ─── GENERATE TALKING POINTS FROM METRICS ───
function generateTalkingPoints(h, conv, doc) {
  const pts = [];

  // Oldest lead
  if (h.leads && h.leads.length > 0) {
    const top = h.leads[0];
    if (top.days >= 21) {
      pts.push(`${top.name} at ${top.days} days — close or cut decision needed now`);
    } else if (top.days >= 8) {
      pts.push(`${top.name} in the hot window at ${top.days} days — push for contact today`);
    }
  }

  // Conversion
  if (h.conversions === 0 && h.totalLeads > 0) {
    pts.push('No conversions yet — what objections keep coming up?');
  } else if (conv >= 14) {
    pts.push(`Conversion rate ${conv}% — best on the team this week, highlight publicly`);
  } else if (conv >= 10) {
    pts.push(`Conversion rate ${conv}% — above 10% target, what\'s working?`);
  } else if (h.conversions > 0) {
    pts.push(`Conversion rate ${conv}% — below target, what\'s the common blocker?`);
  }

  // Doc compliance
  if (doc < 60) {
    pts.push(`Doc rate ${doc}% — entries missing, hurting points and pipeline visibility`);
  } else if (doc >= 90) {
    pts.push(`Doc rate ${doc}% — setting the standard, recognize this publicly`);
  } else {
    pts.push(`Doc rate ${doc}% — ${h.totalLeads - h.documented} leads still need logging`);
  }

  // Attempts volume
  if (h.attempts === 0) {
    pts.push('No attempts logged — what\'s blocking activity this week?');
  } else if (h.attempts >= 12) {
    pts.push(`${h.attempts} attempts this week — top activity tier, acknowledge the hustle`);
  }

  return pts.slice(0, 3);
}

// ─── TRANSFORM API RESPONSE → briefData FORMAT ───
function apiToBriefData(hcas) {
  const result = {};
  hcas.forEach(h => {
    const conv = h.totalLeads > 0 ? Math.round((h.conversions / h.totalLeads) * 100) : 0;
    const doc  = h.totalLeads > 0 ? Math.round((h.documented  / h.totalLeads) * 100) : 0;
    const pts  = (h.conversions * 100) + (h.documented * 20) + (h.attempts * 10);
    result[h.name] = {
      attempts:    h.attempts,
      documented:  h.documented,
      conversions: h.conversions,
      totalLeads:  h.totalLeads,
      pts:         pts,
      leads: (h.leads || []).map(l => ({
        name:    l.name,
        days:    l.days,
        amount:  '$' + l.amount.toLocaleString(),
        urgency: l.urgency
      })),
      talking: generateTalkingPoints(h, conv, doc)
    };
  });
  return result;
}

let briefData = { ...FALLBACK_BRIEF };

// ─── LIVE FETCH — renders immediately, upgrades when data arrives ───
async function fetchLiveData() {
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE')) return;
  try {
    const res  = await fetch(SCRIPT_URL + '?cb=' + Date.now());
    const json = await res.json();
    if (!json.hcas || json.error) return;
    briefData = apiToBriefData(json.hcas);
    document.getElementById('cards').innerHTML = '';
    renderCards();
  } catch (e) {
    console.warn('Daily Brief: live fetch failed, using fallback data');
  }
}

function convRate(d){ return d.totalLeads>0 ? Math.round((d.conversions/d.totalLeads)*100) : 0; }
function docRate(d) { return d.attempts>0   ? Math.round((d.documented/d.attempts)*100)   : 0; }

function getDotClass(urgency) {
  return `dot-${urgency}`;
}

function getStatColor(val, type) {
  if(type==='conv') return val >= 10 ? 'green' : val > 0 ? 'yellow' : 'red';
  if(type==='doc')  return val >= 80 ? 'green' : val >= 60 ? 'yellow' : 'red';
  if(type==='att')  return val >= 8  ? 'green' : val >= 4  ? 'yellow' : 'red';
  return 'blue';
}

document.getElementById('dateLabel').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function renderCards() {
  const cards = document.getElementById('cards');
  Object.entries(briefData).forEach(([name, d]) => {
    const conv = d.totalLeads>0 ? Math.round((d.conversions/d.totalLeads)*100) : 0;
    const doc  = d.attempts>0   ? Math.round((d.documented/d.attempts)*100)   : 0;
    cards.innerHTML += `
      <div class="hca-brief">
        <div class="brief-header">
          <div class="brief-name">${name}</div>
          <div class="brief-pts">${d.pts} pts</div>
        </div>
        <div class="brief-stats">
          <div class="brief-stat">
            <div class="stat-val ${getStatColor(conv,'conv')}">${conv}%</div>
            <div class="stat-lbl">Conv Rate</div>
          </div>
          <div class="brief-stat">
            <div class="stat-val ${getStatColor(doc,'doc')}">${doc}%</div>
            <div class="stat-lbl">Doc Rate</div>
          </div>
          <div class="brief-stat">
            <div class="stat-val ${getStatColor(d.attempts,'att')}">${d.attempts}</div>
            <div class="stat-lbl">Attempts</div>
          </div>
        </div>
        ${d.leads.length > 0 ? `
        <div class="brief-leads">
          <div class="leads-title">Oldest Open Leads</div>
          ${d.leads.map(l=>`
            <div class="lead-row">
              <div class="urgency-dot ${getDotClass(l.urgency)}"></div>
              <div class="lead-name">${l.name}</div>
              <div class="lead-days">${l.days}d</div>
              <div class="lead-amount">${l.amount}</div>
            </div>
          `).join('')}
        </div>` : `<div class="brief-leads"><div class="leads-title">No open leads this week</div></div>`}
        <div class="brief-talking">
          <div class="talking-title">Talking Points</div>
          ${d.talking.map(t=>`<div class="talking-point">${t}</div>`).join('')}
        </div>
      </div>`;
  });
}

renderCards();
fetchLiveData();
