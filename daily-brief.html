<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Daily 1-on-1 Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 32px;
  font-size: 14px;
}
.page-header {
  background: var(--surface);
  border-radius: 12px;
  padding: 24px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.page-header img { height: 48px; }
.page-header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.page-header-date {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 4px;
}
.print-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.hca-brief {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.brief-header {
  background: var(--surface);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brief-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
}
.brief-pts {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--orange);
}
.brief-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border);
}
.brief-stat {
  padding: 12px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.brief-stat:last-child { border-right: none; }
.stat-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 3px;
}
.green { color: var(--green); }
.yellow { color: var(--yellow); }
.red { color: var(--red); }
.blue { color: var(--blue); }
.orange { color: var(--orange); }
.brief-talking {
  background: #f8fafc;
  border-top: 1px solid var(--border);
  padding: 12px 18px;
}
.talking-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.talking-point {
  font-size: 12px;
  color: var(--dark);
  line-height: 1.5;
  padding: 3px 0;
  padding-left: 12px;
  position: relative;
}
.talking-point::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--orange);
  font-weight: 700;
}
@media print {
  body { padding: 16px; background: white; }
  .print-btn { display: none; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

  <button class="print-btn" onclick="window.print()">⎙ Print / Save PDF</button>
</div>

<div class="cards-grid" id="cards"></div>

<script>
const briefData = {
  'Amber Maddalena':   { quick:3, followup:33, doc:88, attempts:8, pts:5250 },
  'Chester Granard':   { quick:3, followup:32, doc:71, attempts:14, pts:5100 },
  'Davis Diosdado':    { quick:2, followup:44, doc:67, attempts:6, pts:6800 },
  'Javierre Milo':     { quick:3, followup:37, doc:92, attempts:12, pts:5850 },
  'Joe Chounramany':   { quick:1, followup:41, doc:60, attempts:5, pts:6250 },
  'Joseph Ruble':      { quick:4, followup:45, doc:89, attempts:9, pts:7150 },
  'Kyle McAlister':    { quick:2, followup:46, doc:82, attempts:11, pts:7100 },
  'Samir Khoury':      { quick:3, followup:28, doc:50, attempts:4, pts:4500 },
  'Trevor Bohm':       { quick:2, followup:21, doc:86, attempts:7, pts:3350 },
};

function totalWon(d) { return d.quick + d.followup; }
function getStatColor(val, type) {
  if(type==='won') return val >= 40 ? 'green' : val >= 20 ? 'yellow' : 'red';
  if(type==='doc')  return val >= 80 ? 'green' : val >= 60 ? 'yellow' : 'red';
  if(type==='att')  return val >= 8  ? 'green' : val >= 4  ? 'yellow' : 'red';
  return 'blue';
}

document.getElementById('dateLabel').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

const cards = document.getElementById('cards');
Object.entries(briefData).forEach(([name, d]) => {
  const won = totalWon(d);
  cards.innerHTML += `
    <div class="hca-brief">
      <div class="brief-header">
        <div class="brief-name">${name}</div>
        <div class="brief-pts">${d.pts} pts</div>
      </div>
      <div class="brief-stats">
        <div class="brief-stat">
          <div class="stat-val ${getStatColor(won,'won')}">${won}</div>
          <div class="stat-lbl">Won</div>
        </div>
        <div class="brief-stat">
          <div class="stat-val ${getStatColor(d.doc,'doc')}">${d.doc}%</div>
          <div class="stat-lbl">Doc</div>
        </div>
        <div class="brief-stat">
          <div class="stat-val ${getStatColor(d.attempts,'att')}">${d.attempts}</div>
          <div class="stat-lbl">Attempts</div>
        </div>
      </div>
      <div class="brief-talking">
        <div class="talking-title">Talking Points</div>
        <div class="talking-point">${d.quick} quick (100pts) + ${d.followup} follow-up (150pts) = strategy review</div>
        <div class="talking-point">Doc rate ${d.doc}% — ${d.doc>=80?'on track':'needs improvement'}</div>
        <div class="talking-point">${d.attempts} attempts this week — ${d.attempts>=10?'strong activity':'increase engagement'}</div>
      </div>
    </div>`;
});
</script>
