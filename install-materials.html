<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Install Material Pick List — CM Heating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a1628;--panel:#111a2e;--panel2:#0d1526;--line:#1e2a44;--text:#e6edf7;--mut:#94a3b8;--gold:#f59e0b;--orange:#c97d10;--green:#22c55e;--blue:#4aa3df;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16233f 0,transparent 60%),var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:15px;padding-bottom:90px}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px}
  .pill{background:var(--orange);color:#fff;font-weight:800;letter-spacing:.06em;font-size:12px;padding:6px 12px;border-radius:999px}
  .back{color:var(--mut);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
  h1{font-family:"Playfair Display",serif;font-weight:800;font-size:32px;margin:8px 0 4px}
  .sub{color:var(--mut);margin:0 0 18px;max-width:680px;font-size:13.5px}
  .hdrcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hdrcard .full{grid-column:1/-1}
  label{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font-family:inherit;font-size:15px}
  textarea{resize:vertical;min-height:70px}
  .controls{display:flex;gap:10px;margin-bottom:14px}
  input.search{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;font-family:inherit}
  .mini{background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:10px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap}
  .mini:hover{border-color:var(--gold);color:var(--text)}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .sec-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
  .sec-head:hover{background:#101b31}
  .sec-title{font-family:"Playfair Display",serif;font-weight:700;font-size:16px;flex:1}
  .sec-note{color:var(--gold);font-size:11.5px;padding:0 16px 10px;margin-top:-6px}
  .sec-count{font-size:12px;font-weight:800;color:#1a1200;background:var(--gold);border-radius:999px;padding:2px 9px;display:none}
  .sec-count.on{display:inline-block}
  .chev{color:var(--mut);transition:transform .15s}
  .sec.open .chev{transform:rotate(90deg)}
  .sec-body{display:none;border-top:1px solid var(--line)}
  .sec.open .sec-body{display:block}
  .item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #131f38}
  .item:last-child{border-bottom:0}
  .item.picked{background:rgba(245,158,11,.07)}
  .item-name{flex:1;font-size:14px}
  .item-name small{color:var(--mut)}
  .stepper{display:flex;align-items:center;gap:0;flex-shrink:0}
  .stepper button{width:38px;height:38px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:19px;cursor:pointer;font-family:inherit}
  .stepper .minus{border-radius:10px 0 0 10px}
  .stepper .plus{border-radius:0 10px 10px 0;background:rgba(245,158,11,.15);color:var(--gold);border-color:rgba(245,158,11,.35)}
  .stepper .qty{width:40px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:800;font-size:15px;color:var(--mut)}
  .item.picked .qty{color:var(--gold)}
  .hiddenrow{display:none!important}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#0d1526f2;border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0))}
  .bar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .bar-count{flex:1;font-size:14px;color:var(--mut)}
  .bar-count b{color:var(--text);font-size:16px}
  .go{background:var(--orange);border:0;color:#fff;font-weight:800;padding:13px 22px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px}
  .go:hover{background:#e9960f}
  .ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:600;padding:13px 16px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px}
  #printout{display:none}
  @media print{
    body{background:#fff;color:#000;padding:0}
    .wrap,.bar{display:none}
    #printout{display:block;font-family:Outfit,Arial,sans-serif;color:#000;padding:24px}
    #printout h2{font-family:"Playfair Display",serif;margin:0 0 4px}
    #printout .meta{margin:0 0 14px;font-size:13px}
    #printout h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px;border-bottom:1px solid #999;padding-bottom:2px}
    #printout li{font-size:13px;margin:2px 0}
  }
  @media(max-width:560px){.hdrcard{grid-template-columns:1fr}h1{font-size:26px}}
</style>

var qty={};                      // "s:i" -> count
var el=function(id){return document.getElementById(id)};

function key(s,i){return s+":"+i}
function build(){
  var host=el('sections'), html="";
  SECTIONS.forEach(function(sec,s){
    html+='<div class="sec" id="sec'+s+'"><div class="sec-head" data-s="'+s+'">'+
      '<div class="sec-title">'+sec[0]+'</div><span class="sec-count" id="cnt'+s+'"></span><span class="chev">›</span></div>'+
      (sec[1]?'<div class="sec-note">'+sec[1]+'</div>':'')+
      '<div class="sec-body">';
    sec[2].forEach(function(name,i){
      var k=key(s,i);
      html+='<div class="item" id="row-'+s+'-'+i+'" data-name="'+name.toLowerCase().replace(/"/g,'&quot;')+'">'+
        '<div class="item-name">'+name.replace(/"/g,'&quot;')+'</div>'+
        '<div class="stepper">'+
          '<button class="minus" data-k="'+k+'" data-d="-1">−</button>'+
          '<span class="qty" id="q-'+k.replace(':','-')+'">0</span>'+
          '<button class="plus" data-k="'+k+'" data-d="1">+</button>'+
        '</div></div>';
    });
    html+='</div></div>';
  });
  host.innerHTML=html;
  host.querySelectorAll('.sec-head').forEach(function(h){h.onclick=function(){el('sec'+h.dataset.s).classList.toggle('open')};});
  host.querySelectorAll('.stepper button').forEach(function(b){b.onclick=function(e){e.stopPropagation();bump(b.dataset.k,+b.dataset.d)};});
}
function bump(k,d){
  qty[k]=Math.max(0,(qty[k]||0)+d);
  if(!qty[k])delete qty[k];
  paint(k); totals(); save();
}
function paint(k){
  var p=k.split(':');
  var q=qty[k]||0;
  var span=el('q-'+p[0]+'-'+p[1]); if(span)span.textContent=q;
  var row=el('row-'+p[0]+'-'+p[1]); if(row)row.classList.toggle('picked',q>0);
}
function totals(){
  var tot=0, per={};
  Object.keys(qty).forEach(function(k){tot+=qty[k];var s=k.split(':')[0];per[s]=(per[s]||0)+qty[k];});
  el('tot').textContent=tot;
  SECTIONS.forEach(function(_,s){
    var c=el('cnt'+s); if(!c)return;
    if(per[s]){c.textContent=per[s];c.classList.add('on');}else{c.textContent='';c.classList.remove('on');}
  });
}
function listText(){
  var lines=[];
  lines.push("INSTALL MATERIAL LIST — CM Heating");
  var cust=el('f-customer').value.trim(), job=el('f-job').value.trim(), date=el('f-date').value, hca=el('f-hca').value;
  lines.push((cust?("Customer: "+cust):"Customer: —")+(job?("  ·  Job #"+job):"")+(date?("  ·  Install "+date):""));
  if(hca)lines.push("HCA: "+hca);
  lines.push("");
  SECTIONS.forEach(function(sec,s){
    var got=sec[2].map(function(name,i){return [name,qty[key(s,i)]||0];}).filter(function(x){return x[1]>0;});
    if(!got.length)return;
    lines.push(sec[0].toUpperCase());
    got.forEach(function(x){lines.push("  "+x[1]+" × "+x[0]);});
    lines.push("");
  });
  var extra=el('f-extra').value.trim();
  if(extra){lines.push("ADDITIONAL MATERIALS");lines.push("  "+extra.replace(/\n/g,"\n  "));lines.push("");}
  return lines.join("\n");
}
function copyList(){
  var t=listText();
  function done(ok){var b=el('copyBtn');b.textContent=ok?'Copied ✓':'Copy failed';setTimeout(function(){b.textContent='Copy list'},1500);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true)},function(){fallback()});}
  else fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done(true);}catch(e){done(false);}document.body.removeChild(ta);}
}
function printList(){
  var t=listText().split("\n"), html="", first=true;
  t.forEach(function(line){
    if(!line){html+="";return;}
    if(first){html+="<h2>"+esc(line)+"</h2>";first=false;return;}
    if(/^(Customer|HCA)/.test(line)){html+='<div class="meta">'+esc(line)+"</div>";return;}
    if(/^[A-Z0-9 ().\/&×\-—\"']+$/.test(line)&&line===line.toUpperCase()){html+="<h3>"+esc(line)+"</h3>";return;}
    html+="<li>"+esc(line.trim())+"</li>";
  });
  el('printout').innerHTML=html;
  window.print();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function search(){
  var q=el('q').value.trim().toLowerCase();
  SECTIONS.forEach(function(sec,s){
    var any=false;
    sec[2].forEach(function(name,i){
      var hit=!q||name.toLowerCase().indexOf(q)!==-1;
      var row=el('row-'+s+'-'+i); if(row)row.classList.toggle('hiddenrow',!hit);
      if(hit)any=true;
    });
    var box=el('sec'+s);
    box.style.display=any?'':'none';
    if(q&&any)box.classList.add('open');
    if(!q)box.classList.remove('open');
  });
}
function save(){
  try{localStorage.setItem('cmh_matlist',JSON.stringify({q:qty,c:el('f-customer').value,j:el('f-job').value,d:el('f-date').value,h:el('f-hca').value,x:el('f-extra').value}));}catch(e){}
}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem('cmh_matlist')||'null');
    if(!d)return;
    qty=d.q||{};
    el('f-customer').value=d.c||'';el('f-job').value=d.j||'';el('f-date').value=d.d||'';el('f-hca').value=d.h||'';el('f-extra').value=d.x||'';
    Object.keys(qty).forEach(paint);
  }catch(e){}
}
function clearAll(){
  if(!confirm("Clear the whole list and start fresh?"))return;
  qty={};
  ['f-customer','f-job','f-date','f-extra'].forEach(function(id){el(id).value='';});
  el('f-hca').value='';
  SECTIONS.forEach(function(sec,s){sec[2].forEach(function(_,i){paint(key(s,i));});});
  totals(); save();
}
build(); load(); totals();
el('q').oninput=search;
el('copyBtn').onclick=copyList;
el('printBtn').onclick=printList;
el('clear').onclick=clearAll;
el('expand').onclick=function(){
  var secs=document.querySelectorAll('#sections .sec');
  var anyClosed=Array.prototype.some.call(secs,function(x){return !x.classList.contains('open')});
  secs.forEach(function(x){x.classList.toggle('open',anyClosed)});
  el('expand').textContent=anyClosed?'Collapse all':'Expand all';
};
