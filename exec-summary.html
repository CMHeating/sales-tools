<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Executive Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 40px;
  max-width: 1000px;
  margin: 0 auto;
}
.page-header {
  background: var(--surface);
  border-radius: 12px;
  padding: 28px 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}
.page-header img { height: 52px; }
.header-center { text-align: center; }
.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 3px;
}
.header-sub {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 4px;
  letter-spacing: 1px;
}
.print-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}

/* KPI STRIP */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.kpi {
  background: var(--white);
  border-radius: 8px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--surface);
  padding: 16px;
  text-align: center;
}
.kpi-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 36px;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 6px;
}
.kpi-lbl {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.kpi-delta {
  font-size: 11px;
  font-weight: 600;
  margin-top: 4px;
}
.delta-up { color: var(--green); }
.delta-down { color: var(--red); }

/* SECTIONS */
.section {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
  overflow: hidden;
}
.section-header {
  background: var(--surface);
  padding: 14px 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: white;
}
.section-body { padding: 20px; }

/* TEAM TABLE */
.team-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.team-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.team-table th:not(:first-child) { text-align: center; }
.team-table td {
  padding: 12px;
  border-bottom: 1px solid #f8fafc;
  font-weight: 500;
}
.team-table td:not(:first-child) { text-align: center; }
.team-table tr:last-child td { border-bottom: none; }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.badge-green { background:#dcfce7; color:var(--green); }
.badge-yellow { background:#fef3c7; color:var(--yellow); }
.badge-red { background:#fee2e2; color:var(--red); }

/* PIPELINE */
.pipeline-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #f8fafc;
}
.pipeline-row:last-child { border-bottom: none; }
.pipeline-name { width: 100px; font-weight: 600; }
.pipeline-bar-wrap {
  flex: 1;
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.pipeline-bar {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--orange), #fbbf24);
}
.pipeline-val { width: 80px; text-align: right; font-weight: 700; font-size: 13px; }

/* HIGHLIGHTS / RISKS */
.highlight-list { display: flex; flex-direction: column; gap: 10px; }
.highlight-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.hi-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}
.hi-text { font-size: 13px; line-height: 1.5; }
.hi-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

.footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
@media print {
  body { padding: 20px; background: white; max-width: 100%; }
  .print-btn { display: none; }
}
</style>
</head>
<body>

<div class="page-header">
  <img src="https://cmheating.github.io/sales-tools/cm-logo.webp" alt="CM Heating">
  <div class="header-center">
    <div class="header-title">Sales Executive Summary</div>
    <div class="header-sub" id="dateLabel"></div>
  </div>
  <button class="print-btn" onclick="window.print()">⎙ Print / PDF</button>
</div>

<!-- KPI STRIP -->
<div class="kpi-strip">
  <div class="kpi" style="border-left-color:var(--orange)">
    <div class="kpi-val" style="color:var(--orange)" id="kpi-pipeline"></div>
    <div class="kpi-lbl">Pipeline Value</div>
    <div class="kpi-delta delta-up" id="kpi-pipeline-d"></div>
  </div>
  <div class="kpi" style="border-left-color:var(--green)">
    <div class="kpi-val" style="color:var(--green)" id="kpi-conv"></div>
    <div class="kpi-lbl">Team Conv Rate</div>
    <div class="kpi-delta" id="kpi-conv-d"></div>
  </div>
  <div class="kpi" style="border-left-color:var(--blue)">
    <div class="kpi-val" style="color:var(--blue)" id="kpi-attempts"></div>
    <div class="kpi-lbl">Total Attempts</div>
    <div class="kpi-delta delta-up" id="kpi-attempts-d"></div>
  </div>
  <div class="kpi" style="border-left-color:#6366f1">
    <div class="kpi-val" style="color:#6366f1" id="kpi-doc"></div>
    <div class="kpi-lbl">Doc Compliance</div>
    <div class="kpi-delta" id="kpi-doc-d"></div>
  </div>
  <div class="kpi" style="border-left-color:var(--red)">
    <div class="kpi-val" style="color:var(--red)" id="kpi-critical"></div>
    <div class="kpi-lbl">Critical Leads</div>
    <div class="kpi-delta delta-down" id="kpi-critical-d"></div>
  </div>
</div>

<!-- TEAM PERFORMANCE TABLE -->
<div class="section">
  <div class="section-header">Team Performance — This Week</div>
  <div class="section-body" style="padding:0">
    <table class="team-table">
      <thead>
        <tr>
          <th>HCA</th>
          <th>Conv Rate</th>
          <th>Doc Rate</th>
          <th>Attempts</th>
          <th>Conversions</th>
          <th>Open Leads</th>
          <th>Points</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="teamTable"></tbody>
    </table>
  </div>
</div>

<div class="two-col">

<!-- PIPELINE BY HCA -->
<div class="section">
  <div class="section-header">Pipeline Value by HCA</div>
  <div class="section-body" id="pipeline"></div>
</div>

<!-- HIGHLIGHTS + RISKS -->
<div class="section">
  <div class="section-header">Highlights & Risks</div>
  <div class="section-body">
    <div class="highlight-list" id="highlights"></div>
  </div>
</div>

</div>

<div class="footer">
  Prepared for Paul (Sr VP) &nbsp;·&nbsp; CM Heating Sales Operations &nbsp;·&nbsp; <span id="footerDate"></span>
</div>

<script>
const execData = [
  { name:'Amber',   conv:9,  doc:88, attempts:8,  conversions:1, leads:11, pts:207, pipeline:278106 },
  { name:'Chester', conv:8,  doc:71, attempts:14, conversions:2, leads:24, pts:580, pipeline:519849 },
  { name:'Davis',   conv:0,  doc:67, attempts:6,  conversions:0, leads:16, pts:100, pipeline:303279 },
  { name:'Jay',     conv:11, doc:92, attempts:12, conversions:2, leads:18, pts:560, pipeline:339725 },
  { name:'Joe',     conv:10, doc:60, attempts:5,  conversions:1, leads:10, pts:180, pipeline:206686 },
  { name:'Joseph',  conv:8,  doc:89, attempts:9,  conversions:1, leads:13, pts:290, pipeline:331827 },
  { name:'Kyle',    conv:6,  doc:82, attempts:11, conversions:1, leads:16, pts:300, pipeline:284349 },
  { name:'Samir',   conv:0,  doc:50, attempts:4,  conversions:0, leads:0,  pts:60,  pipeline:0 },
  { name:'Trevor',  conv:14, doc:86, attempts:7,  conversions:1, leads:7,  pts:230, pipeline:148519 },
];

function getBadge(val, type) {
  if(type==='conv') {
    if(val>=10) return '<span class="badge badge-green">Strong</span>';
    if(val>0)   return '<span class="badge badge-yellow">Building</span>';
    return '<span class="badge badge-red">Needs Attn</span>';
  }
  if(type==='doc') {
    if(val>=80) return '<span class="badge badge-green">On Track</span>';
    if(val>=60) return '<span class="badge badge-yellow">Improving</span>';
    return '<span class="badge badge-red">Lagging</span>';
  }
}

function fmtCurrency(n) {
  if(n >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
  if(n >= 1000)    return '$' + Math.round(n/1000) + 'K';
  return '$' + n;
}

const now = new Date();
const dateStr = now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.getElementById('dateLabel').textContent = dateStr;
document.getElementById('footerDate').textContent = now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

// KPIs
const totalPipeline = execData.reduce((s,d)=>s+d.pipeline,0);
const totalAttempts  = execData.reduce((s,d)=>s+d.attempts,0);
const totalConv      = execData.reduce((s,d)=>s+d.conversions,0);
const totalLeads     = execData.reduce((s,d)=>s+d.leads,0);
const avgDoc         = Math.round(execData.reduce((s,d)=>s+d.doc,0)/execData.length);
const avgConv        = totalLeads>0 ? Math.round((totalConv/totalLeads)*100) : 0;
const criticalLeads  = 23; // demo - would be calculated from tracker

document.getElementById('kpi-pipeline').textContent = fmtCurrency(totalPipeline);
document.getElementById('kpi-pipeline-d').textContent = '↑ Active pipeline this week';
document.getElementById('kpi-conv').textContent = avgConv + '%';
document.getElementById('kpi-conv-d').className = 'kpi-delta ' + (avgConv>=10?'delta-up':'delta-down');
document.getElementById('kpi-conv-d').textContent = avgConv>=10 ? '↑ Above target' : '↓ Below 10% target';
document.getElementById('kpi-attempts').textContent = totalAttempts;
document.getElementById('kpi-attempts-d').textContent = '↑ ' + totalAttempts + ' attempts this week';
document.getElementById('kpi-doc').textContent = avgDoc + '%';
document.getElementById('kpi-doc-d').className = 'kpi-delta ' + (avgDoc>=80?'delta-up':'delta-down');
document.getElementById('kpi-doc-d').textContent = avgDoc>=80 ? '↑ Team on track' : '↓ Below 80% target';
document.getElementById('kpi-critical').textContent = criticalLeads;
document.getElementById('kpi-critical-d').textContent = '↓ Leads 21+ days old';

// Team table
const tbody = document.getElementById('teamTable');
execData.sort((a,b)=>b.pts-a.pts).forEach((d,i) => {
  const status = d.conv>=10 && d.doc>=80 ? 'badge-green' : d.conv===0 || d.doc<60 ? 'badge-red' : 'badge-yellow';
  const statusText = d.conv>=10 && d.doc>=80 ? 'On Track' : d.conv===0 || d.doc<60 ? 'Needs Attn' : 'Watch';
  tbody.innerHTML += `
    <tr>
      <td><strong>${d.name}</strong></td>
      <td>${getBadge(d.conv,'conv')}</td>
      <td>${getBadge(d.doc,'doc')}</td>
      <td>${d.attempts}</td>
      <td>${d.conversions}</td>
      <td>${d.leads}</td>
      <td><strong style="color:var(--orange)">${d.pts}</strong></td>
      <td><span class="badge ${status}">${statusText}</span></td>
    </tr>`;
});

// Pipeline
const maxPipeline = Math.max(...execData.map(d=>d.pipeline));
const pipelineEl = document.getElementById('pipeline');
[...execData].sort((a,b)=>b.pipeline-a.pipeline).forEach(d => {
  if(d.pipeline === 0) return;
  pipelineEl.innerHTML += `
    <div class="pipeline-row">
      <div class="pipeline-name">${d.name}</div>
      <div class="pipeline-bar-wrap">
        <div class="pipeline-bar" style="width:${Math.round((d.pipeline/maxPipeline)*100)}%"></div>
      </div>
      <div class="pipeline-val">${fmtCurrency(d.pipeline)}</div>
    </div>`;
});

// Highlights
document.getElementById('highlights').innerHTML = `
  <div class="highlight-item">
    <div class="hi-icon">👑</div>
    <div>
      <div class="hi-label">Top Performer</div>
      <div class="hi-text">Chester leads with 580 pts — 2 conversions and 14 follow-up attempts this week.</div>
    </div>
  </div>
  <div class="highlight-item">
    <div class="hi-icon">⭐</div>
    <div>
      <div class="hi-label">Best Documentation</div>
      <div class="hi-text">Jay at 92% doc rate sets the standard for accountability. Recognize publicly.</div>
    </div>
  </div>
  <div class="highlight-item">
    <div class="hi-icon">🎯</div>
    <div>
      <div class="hi-label">Highest Conv Rate</div>
      <div class="hi-text">Trevor converting at 14% — best close rate on the team this week.</div>
    </div>
  </div>
  <div class="highlight-item">
    <div class="hi-icon">⚠️</div>
    <div>
      <div class="hi-label">Needs Attention</div>
      <div class="hi-text">Davis — 0 conversions, 67% doc rate, multiple 21+ day leads. Coaching conversation needed.</div>
    </div>
  </div>
  <div class="highlight-item">
    <div class="hi-icon">🔥</div>
    <div>
      <div class="hi-label">At Risk Pipeline</div>
      <div class="hi-text">${fmtCurrency(criticalLeads * 18000)} in leads 21+ days old — team needs close or cut decisions this week.</div>
    </div>
  </div>`;
</script>
</body>
</html>
