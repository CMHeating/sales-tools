<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Executive Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --yellow: #d97706;
  --red: #dc2626;
  --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 40px;
  max-width: 1000px;
  margin: 0 auto;
}
.page-header {
  background: var(--surface);
  border-radius: 12px;
  padding: 28px 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}
.page-header img { height: 52px; }
.header-center { text-align: center; }
.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 3px;
}
.header-sub {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 4px;
  letter-spacing: 1px;
}
.print-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}

/* KPI STRIP */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.kpi {
  background: var(--white);
  border-radius: 8px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--orange);
  padding: 16px;
  text-align: center;
}
.kpi-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 36px;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 6px;
}
.kpi-lbl {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* SECTIONS */
.section {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
  overflow: hidden;
}
.section-header {
  background: var(--surface);
  padding: 14px 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: white;
}
.section-body { padding: 20px; }

/* TEAM TABLE */
.team-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.team-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.team-table th:not(:first-child) { text-align: center; }
.team-table td {
  padding: 12px;
  border-bottom: 1px solid #f8fafc;
  font-weight: 500;
}
.team-table td:not(:first-child) { text-align: center; }
.team-table tr:last-child td { border-bottom: none; }

/* PIPELINE */
.pipeline-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #f8fafc;
}
.pipeline-row:last-child { border-bottom: none; }
.pipeline-name { width: 100px; font-weight: 600; font-size: 13px; }
.pipeline-bar-wrap {
  flex: 1;
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.pipeline-bar {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--orange), #fbbf24);
}
.pipeline-val { width: 100px; text-align: right; font-weight: 700; font-size: 13px; }

/* HIGHLIGHTS / RISKS */
.highlight-list { display: flex; flex-direction: column; gap: 10px; }
.highlight-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.hi-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}
.hi-text { font-size: 13px; line-height: 1.5; }
.hi-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

.footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-size: 16px;
}

@media print {
  body { padding: 20px; background: white; max-width: 100%; }
  .print-btn { display: none; }
}
</style>
</head>
<body>

<div class="page-header">
  <img src="data:image/webp;base64,UklGRnQOAABXRUJQVlA4WAoAAAAQAAAAvQAAewAAQUxQSC0IAAAB8BvbWh5t27Yte4sAb0tBVSSBL48wtlAIA5c88BQBEagKfxnQu5BaV1+/910RMQH4f0D6H6/8dr7JT2fUny4x/nJSmX66zvrLBbLJD2ck/Q9XSNrvJo1k+d18J9l+t8BRfrY0CT9bmdjP1iflV/OcNvnRbEb/o6UP8TeT+iH9YqKxf6hB5aeSYKXyz70W8/ILiY+pdq7tNUUvv4toSKV13ttbsaDyc0iwUjuf2msxLz9GKo3PbcXCbzGKj6n221pNUQU/qwYrbVlN5gU/sIRU2t96KxYEv7R46x9aUMHvLfVDwk/q3HanA5A+RADbvnT7sK91bt/33WF/I7fnfJy3GgD74AFkLrUPB5fuLh85mzvlbWTPvD8D8LMmAI41eebONRkuIx+Z7mX2g088BZA+KQCEaw+Z7LwjH8f2Ki7zmecGoE4SgG3R6Sa26HSyYXPbJm+ynXzqDiBNAgBbxH2SF3HD++4nH5sBxIkCyKtscqyy99lPPvcA4DvJBsAdq/LgzkVnfp3t5INPAaSRLAC2c9Ux7Fx9vI07+OgNQCFpAIyrTwfAlp3uZTKfbQASyQAgL+MOIC/j/i7b+awzAwhkVwDHOgNwrLN3yXz4IYB2VgCO6zMgXJ/fRByffjpAKhOA/YYD2G443gT5cdwBFEYAdgMd7Aa6F5HjeQbA6AHkO3bkO/YX2fj8DMA3AeS4w+S4w17EvuAQQIoA7rwju/OO/CJ5zZnvdQAigJ13HjvvPNy7ZYf7BUC+5cy3cHs3h4few/Oe/T2OFQce6o57bs7vkVec7iEbr5/nonPB8WrM7hn7giMvyivcq/HMd29DXpBt0XZc4/Ya+5rbz8mxwPY1J/ICe43tKw4ZzgWbW5NhC/JryPENGQA2Xj8dzkX7guM1kL/BBluQgbxkhyygvMb2DfuQn7MBx4L9NZC/wAGQY8EO2IrTAXmBvcd+Pu4AAHcucMC24gCwL8jvgfy4POy8fgBw54IMYDuvHfIe7niaDbYgA8CxwADIcY3uPbCdD9uHvMCGvGAHgLxgfxHs56NOB0COBdtgC9xg1878JtjPJx0AsJ3XTjfs147Jdo3vgv18zpmHndczxu1axujOa4e8Clx+DPfBlrlzEfK1c3sXiJ1P2Ya8YJ/guGTLuL8MIHY84nDDucDN8qV9ti/IrwPIZvk4b2YGAMfrh8zskpuI+4cwittudpN9IeZuv4qP+8KX+o9I9SoQ7xXqpzqo94D4j6LeQ70XQL0XABpi8HJNfIxBBRAfg5/5GL0A4r1OvPcQ7wUQ7xWAhhi8fou0XgXaepHapxGA770pYv8Ya+8ovRtgvQdo6SR7veRrJ9kNoXayFwW0dJI1IPSeBmm9IvWeAOs9QlIjyaZfw6GzSOV0SCQTjB9jJVHIHmBkkMZpueI7pzF0Tqto5bT7QH5gQyJ7gJFRCqdN3qDHEIIC2kg20RASmULQD2xqZDSymw8WZm5zk0o2CzFpJUuIjTQjawiFLPESmx8CyeRDtC/qKZUPpRQDYGQhI4BIGoBPLImMlYxqFs0P+8lzB6Cd3QOAdjYBAlkqGQBp7AtYExkTmcTMYvye+TAWAJVNGqtc62SbdB9JMg2Z5OEAJRsmZAGgZG2kAKikXepkn5mSZP2eXmvts1KKAYGsVkl/LXaSjIWMvpR6qbP7SWcTIJClkgHQzh4vWSPJaGSSUuo3VRGdteC9FxTOyzWNQzCymY8f9pOnAZBKthhi8pUsITbSElljKGSJZA0hhE8h9CGQPflQvgsfplE7e2uts+s1pEEa5xNs+4bRd05j4LyKVE67D5xW/SQ2SOL8RRJpAIxMC6SQAVo6yV7C5I+hDt0QKsleFNDSSdaABUAiIyS1odqXQFUBqCpEp6KqAkBUBaIqAFQVqgpAVAWAhuAV10VD8CqA+   <div class="header-center">
    <div class="header-title">Sales Executive Summary</div>
    <div class="header-sub" id="dateLabel"></div>
  </div>
  <button class="print-btn" onclick="window.print()">⎙ Print / PDF</button>
</div>

<!-- KPI STRIP -->
<div class="kpi-strip">
  <div class="kpi">
    <div class="kpi-val" style="color:var(--orange)" id="kpi-pipeline"></div>
    <div class="kpi-lbl">Pipeline Value</div>
  </div>
  <div class="kpi">
    <div class="kpi-val" style="color:var(--green)" id="kpi-leads"></div>
    <div class="kpi-lbl">Open Leads</div>
  </div>
  <div class="kpi">
    <div class="kpi-val" style="color:var(--blue)" id="kpi-attempts"></div>
    <div class="kpi-lbl">Total Attempts</div>
  </div>
</div>

<!-- TEAM PERFORMANCE TABLE -->
<div class="section">
  <div class="section-header">Team Performance — This Week</div>
  <div class="section-body" style="padding:0">
    <table class="team-table">
      <thead>
        <tr>
          <th>HCA</th>
          <th>Leads</th>
          <th>Attempts</th>
          <th>Avg Age</th>
          <th>Pipeline</th>
        </tr>
      </thead>
      <tbody id="teamTable"></tbody>
    </table>
  </div>
</div>

<div class="two-col">

<!-- PIPELINE BY HCA -->
<div class="section">
  <div class="section-header">Pipeline Value by HCA</div>
  <div class="section-body" id="pipeline"></div>
</div>

<!-- HIGHLIGHTS + RISKS -->
<div class="section">
  <div class="section-header">Key Insights</div>
  <div class="section-body">
    <div class="highlight-list" id="highlights"></div>
  </div>
</div>

</div>

<div class="footer">
  Prepared for Paul (Sr VP) and Kailana (GM) &nbsp;·&nbsp; CM Heating Sales Operations &nbsp;·&nbsp; <span id="footerDate"></span>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwdv7ergbHro5N5vBj8ksUY6ObKNsBm1G0tE4ZwIPheCzrgpnr0CD06YRCMa4myvWJu/exec';

let allLeads = [];

function fmtCurrency(n) {
  if (!n) return '$0';
  if (n >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n/1000) + 'K';
  return '$' + Math.round(n);
}

async function loadData() {
  try {
    const response = await fetch(API_URL);
    allLeads = await response.json();
    
    const now = new Date();
    document.getElementById('dateLabel').textContent = now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    document.getElementById('footerDate').textContent = now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    
    // KPIs
    const totalPipeline = allLeads.reduce((s,d)=>s+(d.estValue||0),0);
    const totalAttempts  = allLeads.reduce((s,d)=>s+(d.attempts||0),0);
    const totalLeads     = allLeads.length;
    
    document.getElementById('kpi-pipeline').textContent = fmtCurrency(totalPipeline);
    document.getElementById('kpi-leads').textContent = totalLeads;
    document.getElementById('kpi-attempts').textContent = totalAttempts;
    
    // Team table
    const hcaNames = [...new Set(allLeads.map(l => l.hca))].sort();
    const tbody = document.getElementById('teamTable');
    
    hcaNames.forEach(hca => {
      const hcaLeads = allLeads.filter(l => l.hca === hca);
      const attempts = hcaLeads.reduce((s,l)=>s+(l.attempts||0),0);
      const avgAge = hcaLeads.length > 0 ? Math.round(hcaLeads.reduce((s,l)=>s+(l.daysOld||0),0)/hcaLeads.length) : 0;
      const pipeline = hcaLeads.reduce((s,l)=>s+(l.estValue||0),0);
      
      tbody.innerHTML += `
        <tr>
          <td><strong>${hca}</strong></td>
          <td>${hcaLeads.length}</td>
          <td>${attempts}</td>
          <td>${avgAge}d</td>
          <td><strong style="color:var(--orange)">${fmtCurrency(pipeline)}</strong></td>
        </tr>`;
    });
    
    // Pipeline chart
    const maxPipeline = Math.max(...hcaNames.map(h => allLeads.filter(l => l.hca === h).reduce((s,l)=>s+(l.estValue||0),0)));
    const pipelineEl = document.getElementById('pipeline');
    pipelineEl.innerHTML = hcaNames.map(hca => {
      const pipeline = allLeads.filter(l => l.hca === hca).reduce((s,l)=>s+(l.estValue||0),0);
      if(pipeline === 0) return '';
      return `
        <div class="pipeline-row">
          <div class="pipeline-name">${hca}</div>
          <div class="pipeline-bar-wrap">
            <div class="pipeline-bar" style="width:${Math.round((pipeline/maxPipeline)*100)}%"></div>
          </div>
          <div class="pipeline-val">${fmtCurrency(pipeline)}</div>
        </div>`;
    }).filter(x=>x).join('');
    
    // Highlights
    const totalCritical = allLeads.filter(l => (l.daysOld || 0) > 14).length;
    const avgAttempts = totalLeads > 0 ? Math.round(totalAttempts / totalLeads) : 0;
    
    document.getElementById('highlights').innerHTML = `
      <div class="highlight-item">
        <div class="hi-icon">📊</div>
        <div>
          <div class="hi-label">Pipeline Status</div>
          <div class="hi-text">${totalPipeline > 0 ? `$${(totalPipeline/1000).toFixed(0)}K in active opportunities across ${totalLeads} leads.` : 'No active unsold leads.'}</div>
        </div>
      </div>
      <div class="highlight-item">
        <div class="hi-icon">🎯</div>
        <div>
          <div class="hi-label">Activity Level</div>
          <div class="hi-text">Team logged ${totalAttempts} follow-up attempts this week (avg ${avgAttempts} per HCA).</div>
        </div>
      </div>
      <div class="highlight-item">
        <div class="hi-icon">⚠️</div>
        <div>
          <div class="hi-label">Critical Leads</div>
          <div class="hi-text">${totalCritical} leads over 14 days old — need close or cut decisions.</div>
        </div>
      </div>`;
    
  } catch (err) {
    console.error('Failed to load data:', err);
    document.getElementById('teamTable').innerHTML = '<tr><td colspan="5" class="loading">Failed to load summary data</td></tr>';
  }
}

loadData();
</script>
</body>
</html>
