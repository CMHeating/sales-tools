body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--dark);padding:32px;font-size:14px;line-height:1.6;max-width:1100px;margin:0 auto;}

.header-sub{font-size:13px;color:#94a3b8;font-weight:500;margin-top:4px;}
.print-btn{padding:10px 20px;background:var(--orange);color:white;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.summary-tile{background:var(--white);border-radius:8px;border:1px solid var(--border);padding:16px;text-align:center;}
.tile-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;line-height:1;margin-bottom:4px;}
.tile-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--white);font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
.filter-btn.active{background:var(--surface);color:white;border-color:var(--surface);}
.filter-btn .count{display:inline-block;background:var(--bg);color:var(--dark);border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;margin-left:4px;}
.filter-btn.active .count{background:rgba(255,255,255,.2);color:white;}
.leads-list{display:flex;flex-direction:column;gap:12px;}
.lead-card{background:var(--white);border-radius:10px;border:1px solid var(--border);overflow:hidden;}
.lead-card.hidden{display:none;}.lead-card.saved{border-color:#bbf7d0;}

  <div class="summary-tile"><div class="tile-val" style="color:var(--orange)">${fmtK(totalPipeline)}</div><div class="tile-lbl">Pipeline Value</div></div>
  <div class="summary-tile"><div class="tile-val" style="color:${criticalCount>0?'#dc2626':'#16a34a'}">${criticalCount}</div><div class="tile-lbl">Critical (15+ Days)</div></div>
  <div class="summary-tile"><div class="tile-val" style="color:var(--muted)">${avgDays}d</div><div class="tile-lbl">Avg Days Old</div></div>`;
const counts={all:leads.length,critical:leads.filter(l=>l.daysOld>14).length,hot:leads.filter(l=>l.daysOld>7&&l.daysOld<=14).length,fresh:leads.filter(l=>l.daysOld<=7).length};
let activeFilter='all';
function renderFilters(){document.getElementById('filters').innerHTML=[{key:'all',label:'All Leads'},{key:'critical',label:'Critical (15+ days)'},{key:'hot',label:'Hot (8-14 days)'},{key:'fresh',label:'Fresh (0-7 days)'}].map(f=>`<button class="filter-btn ${f.key===activeFilter?'active':''}" onclick="setFilter('${f.key}')">${f.label} <span class="count">${counts[f.key]}</span></button>`).join('');}
function setFilter(key){activeFilter=key;renderFilters();document.querySelectorAll('.lead-card').forEach(c=>c.classList.toggle('hidden',key!=='all'&&c.dataset.urg!==key));}
renderFilters();
const listEl=document.getElementById('leadsList');
const savedNotes={};
function togglePriorNotes(i){const toggle=document.getElementById(`pnToggle-${i}`);const body=document.getElementById(`pnBody-${i}`);toggle.classList.toggle('open');body.classList.toggle('open');}
function buildPriorNotesHTML(lead,i){
  const notes=lead.notes||'';const lines=notes.split('\n').filter(l=>l.trim());const count=lines.length;
  const entriesHTML=count>0?lines.map(line=>{const match=line.match(/^\[(.+?)\]\s*(.*)$/);const ts=match?match[1]:'';const txt=match?match[2]:line;return`<div class="prior-note-entry"><div class="prior-note-ts">${ts}</div><div class="prior-note-text">${txt}</div></div>`;}).join(''):'<div class="no-notes">No prior notes logged yet.</div>';
  return`<div class="prior-notes-section"><button class="prior-notes-toggle" id="pnToggle-${i}" onclick="togglePriorNotes(${i})"><span class="toggle-label">Prior Notes <span class="note-count">${count}</span></span><span class="chevron">▼</span></button><div class="prior-notes-body" id="pnBody-${i}">${entriesHTML}</div></div>`;
}
if(leads.length===0){listEl.innerHTML='<div class="empty-state"><div style="font-size:48px">✅</div><div style="font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;margin-top:12px">No Open Leads</div><p style="margin-top:8px;font-size:13px">You have no open leads this week.</p></div>';}
else{leads.forEach((lead,i)=>{const urg=getUrgency(lead.daysOld);const card=document.createElement('div');card.className='lead-card';card.id=`card-${i}`;card.dataset.urg=urg.filter;
card.innerHTML=`<div class="lead-header"><div class="urgency-bar ${urg.cls}"></div><div class="lead-info"><div class="lead-name">${lead.customer}</div><div class="lead-meta">${lead.address} &middot; ${lead.phone} &middot; Created ${lead.createdOn} &middot; ${lead.followUps} follow-up${lead.followUps!==1?'s':''} logged</div></div><div class="lead-stats"><div class="stat-block"><div class="stat-val" style="color:${getDaysColor(lead.daysOld)}">${lead.daysOld}d</div><div class="stat-lbl">Days Old</div></div><div class="stat-block"><div class="stat-val">${lead.estimate}</div><div class="stat-lbl">Estimate</div></div><div class="stat-block"><span class="status-badge badge-${lead.status}" id="badge-${i}">${lead.status}</span></div></div></div><div class="lead-body"><div class="status-group"><div class="field-label">Update Status</div><select class="status-select" id="status-${i}"><option value="Contacted" ${lead.status==='Contacted'?'selected':''}>Contacted</option><option value="Unreachable" ${lead.status==='Unreachable'?'selected':''}>Unreachable</option><option value="NotAttempted" ${lead.status==='NotAttempted'?'selected':''}>Not Attempted</option><option value="Lost" ${lead.status==='Lost'?'selected':''}>Lost</option><option value="Sold" ${lead.status==='Sold'?'selected':''}>Sold ✓</option></select></div><div class="notes-group"><div class="field-label">Follow-Up Notes (required to save)</div><textarea class="notes-input" id="notes-${i}" placeholder="What happened? Any objections? Next step?"></textarea></div><div class="save-group"><button class="save-btn" id="saveBtn-${i}" onclick="logFollowUp(${i})">Log Follow-Up</button><div class="save-feedback" id="saveFeedback-${i}"></div><div class="st-reminder" id="stReminder-${i}"><div class="st-reminder-title">📋 Paste into ServiceTitan:</div><button class="copy-btn" id="copyBtn-${i}" onclick="copyNote(${i})">📋 Copy Note</button><div class="copy-note-preview" id="notePreview-${i}"></div></div></div></div>${buildPriorNotesHTML(lead,i)}`;
listEl.appendChild(card);});}
function logFollowUp(i){
  const lead=leads[i],status=document.getElementById(`status-${i}`).value,notes=document.getElementById(`notes-${i}`).value.trim();
  const btn=document.getElementById(`saveBtn-${i}`),feedback=document.getElementById(`saveFeedback-${i}`),badge=document.getElementById(`badge-${i}`),reminder=document.getElementById(`stReminder-${i}`),preview=document.getElementById(`notePreview-${i}`);
  if(!notes){feedback.textContent='Add a note before saving.';feedback.className='save-feedback err';return;}
  btn.disabled=true;btn.textContent='Saving...';feedback.textContent='';feedback.className='save-feedback';
  const ts=new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  const stNote=`[${ts}] Status: ${status} | ${notes}`;savedNotes[i]=stNote;
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({hca:HCA_NAME,customer:lead.customer,status,notes,timestamp:ts,daysOld:lead.daysOld,estimate:lead.estimate})})
  .then(()=>{btn.textContent='Logged ✓';btn.className='save-btn success';feedback.textContent='Saved '+ts;feedback.className='save-feedback ok';document.getElementById(`notes-${i}`).value='';badge.textContent=status;badge.className=`status-badge badge-${status}`;document.getElementById(`card-${i}`).classList.add('saved');preview.textContent=stNote;reminder.classList.add('visible');
    const body=document.getElementById(`pnBody-${i}`),toggle=document.getElementById(`pnToggle-${i}`),noNotes=body.querySelector('.no-notes');if(noNotes)noNotes.remove();
    const entry=document.createElement('div');entry.className='prior-note-entry';entry.innerHTML=`<div class="prior-note-ts">${ts}</div><div class="prior-note-text">Status: ${status} | ${notes}</div>`;body.insertBefore(entry,body.firstChild);
    const countEl=toggle.querySelector('.note-count');countEl.textContent=parseInt(countEl.textContent||0)+1;if(!body.classList.contains('open')){toggle.classList.add('open');body.classList.add('open');}})
  .catch(()=>{btn.disabled=false;btn.textContent='Log Follow-Up';feedback.textContent='Error — try again.';feedback.className='save-feedback err';});
}
function copyNote(i){const copyBtn=document.getElementById(`copyBtn-${i}`),note=savedNotes[i]||'';if(!note)return;navigator.clipboard.writeText(note).then(()=>{copyBtn.textContent='✓ Copied!';copyBtn.className='copy-btn copied';}).catch(()=>{const ta=document.createElement('textarea');ta.value=note;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);copyBtn.textContent='✓ Copied!';copyBtn.className='copy-btn copied';});}
</script>
</body>
</html>
