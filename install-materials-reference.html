  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16233f 0,transparent 60%),var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:15px;padding-bottom:40px}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px}
  .pill{background:var(--orange);color:#fff;font-weight:800;letter-spacing:.06em;font-size:12px;padding:6px 12px;border-radius:999px}
  .back{color:var(--mut);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
  h1{font-family:"Playfair Display",serif;font-weight:800;font-size:32px;margin:8px 0 4px}
  .sub{color:var(--mut);margin:0 0 18px;max-width:680px;font-size:13.5px}
  .controls{display:flex;gap:10px;margin-bottom:14px}
  input.search{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;font-family:inherit}
  .mini{background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:10px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap}
  .mini:hover{border-color:var(--gold);color:var(--text)}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .sec-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
  .sec-head:hover{background:#101b31}
  .sec-title{font-family:"Playfair Display",serif;font-weight:700;font-size:16px;flex:1}
  .sec-count{font-size:12px;font-weight:800;color:#1a1200;background:var(--gold);border-radius:999px;padding:2px 9px}
  .sec-note{color:var(--gold);font-size:11.5px;padding:0 16px 10px;margin-top:-6px}
  .chev{color:var(--mut);transition:transform .15s}
  .sec.open .chev{transform:rotate(90deg)}
  .sec-body{display:none;border-top:1px solid var(--line)}
  .sec.open .sec-body{display:block}
  .item{padding:10px 16px;border-bottom:1px solid #131f38;font-size:14px}
  .item:last-child{border-bottom:0}
  .hiddenrow{display:none!important}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  @media(max-width:560px){h1{font-size:26px}}

  <h1>Install Materials — Reference</h1>
  <p class="sub">A quick reference for what an install may call for, grouped by category. Tap a section to open it, or search to jump straight to an item. This is a look-up list — no data entry.</p>

    <input class="search" id="q" placeholder="Search materials… (e.g. flex, drain pan, 3/8)">
    <button class="mini" id="expand">Expand all</button>
  </div>

  <div id="sections"></div>
  <div class="foot" id="foot"></div>
</div>

var el=function(id){return document.getElementById(id)};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

function build(){
  var host=el('sections'), html="", total=0;
  SECTIONS.forEach(function(sec,s){
    total+=sec[2].length;
    html+='<div class="sec" id="sec'+s+'"><div class="sec-head" data-s="'+s+'">'+
      '<div class="sec-title">'+esc(sec[0])+'</div><span class="sec-count">'+sec[2].length+'</span><span class="chev">›</span></div>'+
      (sec[1]?'<div class="sec-note">'+esc(sec[1])+'</div>':'')+
      '<div class="sec-body">';
    sec[2].forEach(function(name,i){
      html+='<div class="item" id="row-'+s+'-'+i+'" data-name="'+esc(name.toLowerCase())+'">'+esc(name)+'</div>';
    });
    html+='</div></div>';
  });
  host.innerHTML=html;
  el('foot').textContent=SECTIONS.length+" categories · "+total+" items";
  host.querySelectorAll('.sec-head').forEach(function(h){h.onclick=function(){el('sec'+h.dataset.s).classList.toggle('open')};});
}
function search(){
  var q=el('q').value.trim().toLowerCase();
  SECTIONS.forEach(function(sec,s){
    var any=false;
    sec[2].forEach(function(name,i){
      var hit=!q||name.toLowerCase().indexOf(q)!==-1;
      var row=el('row-'+s+'-'+i); if(row)row.classList.toggle('hiddenrow',!hit);
      if(hit)any=true;
    });
    var box=el('sec'+s);
    box.style.display=any?'':'none';
    if(q&&any)box.classList.add('open');
    if(!q)box.classList.remove('open');
  });
}
build();
el('q').oninput=search;
el('expand').onclick=function(){
  var secs=document.querySelectorAll('#sections .sec');
  var anyClosed=Array.prototype.some.call(secs,function(x){return !x.classList.contains('open')});
  secs.forEach(function(x){x.classList.toggle('open',anyClosed)});
  el('expand').textContent=anyClosed?'Collapse all':'Expand all';
};
</script>
