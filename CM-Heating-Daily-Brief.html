<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Daily 1-on-1 Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9; --white: #ffffff; --dark: #0f172a; --surface: #1e293b;
  --orange: #f97316; --muted: #64748b; --border: #e2e8f0;
  --green: #16a34a; --yellow: #d97706; --red: #dc2626; --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Barlow',sans-serif; background:var(--bg); color:var(--dark); padding:32px; font-size:14px; min-height:100vh; }
.page-header { background:var(--surface); border-radius:12px; padding:24px 32px; display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.page-header img { height:48px; }
.header-center { text-align:center; }
.page-header-title { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:900; color:white; text-transform:uppercase; letter-spacing:2px; }
.page-header-date { font-size:13px; color:#94a3b8; font-weight:500; margin-top:4px; }
.print-btn { padding:10px 20px; background:var(--orange); color:white; border:none; border-radius:6px; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.selector-bar { background:var(--white); border:1px solid var(--border); border-radius:10px; padding:16px 24px; display:flex; align-items:center; gap:16px; margin-bottom:24px; }
.selector-label { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
.hca-select { flex:1; max-width:320px; padding:10px 14px; border:1px solid var(--border); border-radius:6px; font-family:'Barlow',sans-serif; font-size:14px; font-weight:500; color:var(--dark); background:var(--bg); cursor:pointer; outline:none; }
.hca-select:focus { border-color:var(--orange); }
.reset-btn { padding:10px 20px; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:6px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.15s; }
.reset-btn:not(:disabled):hover { border-color:var(--orange); color:var(--orange); }
.reset-btn:disabled { opacity:0.35; cursor:not-allowed; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 40px; gap:16px; }
.empty-icon { font-size:52px; opacity:0.5; }
.empty-text { font-size:16px; font-weight:500; color:var(--muted); }
.card-wrap { display:flex; justify-content:center; }
.hca-brief { background:var(--white); border-radius:10px; border:1px solid var(--border); overflow:hidden; width:100%; max-width:700px; }
.brief-header { background:var(--surface); padding:20px 24px; display:flex; justify-content:space-between; align-items:center; }
.brief-name { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:white; }
.brief-right { text-align:right; }
.brief-pts { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:900; color:var(--orange); line-height:1; }
.brief-rev { font-size:12px; color:#94a3b8; margin-top:3px; font-weight:500; }
.brief-stats { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--border); }
.brief-stat { padding:16px; text-align:center; border-right:1px solid var(--border); }
.brief-stat:last-child { border-right:none; }
.stat-val { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:800; line-height:1; }
.stat-lbl { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.5px; text-transform:uppercase; margin-top:4px; }
.green { color:var(--green); } .yellow { color:var(--yellow); } .red { color:var(--red); } .orange { color:var(--orange); }
.brief-leads { padding:16px 24px; border-bottom:1px solid var(--border); }
.leads-title { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.lead-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f8fafc; }
.lead-row:last-child { border-bottom:none; }
.urgency-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-green { background:var(--green); } .dot-yellow { background:var(--yellow); } .dot-orange { background:#f97316; } .dot-red { background:var(--red); }
.lead-name { flex:1; font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lead-status { font-size:11px; padding:2px 8px; border-radius:4px; font-weight:600; white-space:nowrap; }
.status-not { background:#f1f5f9; color:var(--muted); } .status-cont { background:#dcfce7; color:var(--green); }
.status-unr { background:#fef3c7; color:var(--yellow); } .status-dis { background:#fee2e2; color:var(--red); }
.lead-days { font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
.lead-amount { font-size:13px; font-weight:700; color:var(--dark); white-space:nowrap; }
.brief-talking { background:#f8fafc; padding:16px 24px; }
.talking-title { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.talking-point { font-size:13px; color:var(--dark); line-height:1.6; padding:4px 0 4px 16px; position:relative; }
.talking-point::before { content:'→'; position:absolute; left:0; color:var(--orange); font-weight:700; }
@media print {
  body { padding:16px; background:white; }
  .print-btn, .selector-bar { display:none; }
  .card-wrap { justify-content:flex-start; }
  .hca-brief { max-width:100%; }
}
</style>
</head>
<body>

<div class="page-header">

    <div class="page-header-title">Daily 1-on-1 Brief</div>

function getConvColor(v)   { return v >= 40 ? 'green' : v >= 30 ? 'yellow' : 'red'; }
function getDocColor(v)    { return v >= 50 ? 'green' : v >= 25 ? 'yellow' : 'red'; }
function getAttColor(v)    { return v >= 40 ? 'green' : v >= 10 ? 'yellow' : 'red'; }
function getStatusClass(s) {
  if (!s) return 'status-not';
  const l = s.toLowerCase();
  if (l === 'contacted')   return 'status-cont';
  if (l === 'unreachable') return 'status-unr';
  if (l === 'dismissed')   return 'status-dis';
  return 'status-not';
}
function fmtRevenue(n) {
  if (n >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  return '$' + Math.round(n/1000) + 'K';
}

document.getElementById('dateLabel').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function selectHCA(key) {
  const resetBtn = document.getElementById('resetBtn');
  const content  = document.getElementById('content');
  if (!key) {
    resetBtn.disabled = true;
    content.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">Select an HCA to view their brief.</div></div>`;
    return;
  }
  resetBtn.disabled = false;
  const d = briefData[key];
  content.innerHTML = `
    <div class="card-wrap"><div class="hca-brief">
      <div class="brief-header">
        <div class="brief-name">${d.short}</div>
        <div class="brief-right">
          <div class="brief-pts">${d.pts.toLocaleString()} pts</div>
          <div class="brief-rev">${fmtRevenue(d.revenue)} won &nbsp;·&nbsp; ${d.openLeads} open leads</div>
        </div>
      </div>
      <div class="brief-stats">
        <div class="brief-stat">
          <div class="stat-val ${getConvColor(d.convRate)}">${d.convRate}%</div>
          <div class="stat-lbl">Conv Rate</div>
        </div>
        <div class="brief-stat">
          <div class="stat-val ${getDocColor(d.docRate)}">${d.docRate}%</div>
          <div class="stat-lbl">Doc Rate</div>
        </div>
        <div class="brief-stat">
          <div class="stat-val ${getAttColor(d.attempts)}">${d.attempts}</div>
          <div class="stat-lbl">Attempts</div>
        </div>
      </div>
      <div class="brief-leads">
        <div class="leads-title">Oldest Open Leads</div>
        ${d.leads.map(l=>`
          <div class="lead-row">
            <div class="urgency-dot dot-${l.urgency}"></div>
            <div class="lead-name">${l.name}</div>
            <span class="lead-status ${getStatusClass(l.status)}">${l.status}</span>
            <div class="lead-days">${l.days}d</div>
            <div class="lead-amount">${l.amount}</div>
          </div>`).join('')}
      </div>
      <div class="brief-talking">
        <div class="talking-title">Talking Points</div>
        ${d.talking.map(t=>`<div class="talking-point">${t}</div>`).join('')}
      </div>
    </div></div>`;
}

function resetSelection() {
  document.getElementById('hcaSelect').value = '';
  selectHCA('');
}
</script>
</body>
</html>
