<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HCA 1:1 Scheduler | CM Heating</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#475569;--orange:#f58220;--border:#e2e8f0;
        --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
        --done:#334155;--donebg:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header img{height:34px}
  header a{margin-left:auto;color:var(--orange);text-decoration:none;font-weight:600}
  main{flex:1;padding:20px 16px 48px;max-width:820px;width:100%;margin:0 auto}
  h1{margin:0 0 4px;font-size:24px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
  .card h2{margin:0 0 12px;font-size:17px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .row:last-child{border-bottom:0;padding-bottom:0}
  .row .nm{font-weight:600;flex:1;min-width:150px}
  .row .when{color:var(--muted);font-size:14px;width:100%}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-ok{background:var(--okbg);color:var(--ok)}
  .b-warn{background:var(--warnbg);color:var(--warn)}
  .b-bad{background:var(--badbg);color:var(--bad)}
  .b-done{background:var(--donebg);color:var(--done)}
  label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
        font-family:inherit;font-size:15px;background:#fff;color:var(--text)}
  textarea{min-height:76px;resize:vertical}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:560px){.fields{grid-template-columns:1fr}}
  .btn{background:var(--orange);color:#fff;border:0;font-family:inherit;font-weight:700;font-size:15px;
        padding:12px 20px;border-radius:10px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}
  .slots{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .slot{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;
        font-size:14px;cursor:pointer;text-align:left}
  .slot:hover{border-color:var(--orange)}
  .slot.sel{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  .msg{padding:11px 13px;border-radius:10px;font-size:14px;margin:12px 0 0}
  .m-ok{background:var(--okbg);color:var(--ok)}
  .m-bad{background:var(--badbg);color:var(--bad)}
  .m-info{background:#e0f2fe;color:#075985}
  .muted{color:var(--muted);font-size:13px}
  .cycle{display:inline-block;background:#f8fafc;border:1px solid var(--border);border-radius:999px;
        padding:5px 12px;font-size:13px;color:var(--muted);font-weight:600}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <img src="https://cmheating.github.io/sales-tools/cm-logo.webp" alt="CM Heating">
  <a href="index.html">← HCA Toolkit</a>
</header>

<main>
  <h1>HCA 1:1 Scheduler</h1>
  <p class="sub">1:1s run 20 minutes on a two-week cycle. Geoff books them — everyone can see where the cycle stands.</p>

  <div class="card">
    <h2 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      This cycle <span id="cycle" class="cycle">loading…</span>
    </h2>
    <div id="board"><p class="muted">Loading the roster…</p></div>
    <p id="updated" class="muted" style="margin:14px 0 0"></p>
  </div>

  <div class="card">
    <h2>Book a 1:1</h2>

    <div id="authBox">
      <p class="muted" style="margin:0 0 12px">Booking is limited to Geoff. Sign in with your name and the last 4 of your work phone.</p>
      <div class="fields">
        <div><label for="actor">Name</label><input id="actor" type="text" autocomplete="name" placeholder="Geoff Simons"></div>
        <div><label for="pin">Last 4 of work phone</label><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      </div>
      <button id="signin" class="btn">Sign in</button>
      <div id="authMsg"></div>
    </div>

    <div id="bookBox" class="hide">
      <p class="muted" style="margin:0 0 12px">Signed in as <strong id="who"></strong> ·
        <button id="signout" class="btn btn-ghost" style="padding:4px 10px;font-size:13px">Sign out</button></p>

      <label for="hca">HCA</label>
      <select id="hca" style="margin-bottom:14px"><option value="">Choose an HCA…</option></select>

      <div id="slotWrap" class="hide">
        <label>Open times <span class="muted" style="font-weight:400">(next 3 weeks)</span></label>
        <div id="slots" class="slots"></div>
        <label for="notes">Private notes <span class="muted" style="font-weight:400">— only on your calendar copy</span></label>
        <textarea id="notes" placeholder="Topics for this 1:1…"></textarea>
        <button id="book" class="btn" style="margin-top:12px" disabled>Book this 1:1</button>
      </div>

      <div id="bookMsg"></div>
    </div>
  </div>
</main>

<script>
var API = "https://script.google.com/macros/s/AKfycbzj0JN8EhGOgHOXKnRN0ZNz_Fb4FhF_r-_A4vCZnEnADE80p0w1UfSWIrKxC6_D-3U1fA/exec";
var TZ  = "America/Los_Angeles";

/* Apps Script blocks cross-origin fetch, so every call is JSONP. The backend's
   reply_() wraps any action in a callback when &callback= is supplied. */
function api(params, ok, fail) {
  var name = "__hca1on1_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  var s = document.createElement("script");
  var settled = false;
  function cleanup() {
    settled = true;
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  window[name] = function (data) { if (settled) return; cleanup(); ok(data); };
  var q = [];
  for (var k in params) {
    if (!params.hasOwnProperty(k)) continue;
    var v = params[k];
    if (v === null || v === undefined || v === "") continue;
    q.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
  }
  q.push("callback=" + name);
  s.src = API + "?" + q.join("&");
  s.onerror = function () { if (!settled) { cleanup(); fail("Could not reach the scheduler."); } };
  document.head.appendChild(s);
  setTimeout(function () { if (!settled) { cleanup(); fail("The scheduler took too long to respond."); } }, 30000);
}

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function note(target, text, kind) {
  el(target).innerHTML = text ? '<div class="msg m-' + kind + '">' + esc(text) + "</div>" : "";
}

function fmtDateTime(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleString("en-US", {
    timeZone: TZ, weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit"
  });
}
function fmtSlot(iso) {
  var d = new Date(iso);
  return d.toLocaleString("en-US", {
    timeZone: TZ, weekday: "short", month: "numeric", day: "numeric",
    hour: "numeric", minute: "2-digit"
  });
}
/* cycle dates are plain yyyy-MM-dd — build them locally so no timezone shift. */
function fmtCycleDay(ymd) {
  var p = String(ymd || "").split("-");
  if (p.length !== 3) return ymd || "";
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

var BADGE = {
  "booked":     "b-ok",
  "completed":  "b-done",
  "not booked": "b-warn",
  "due soon":   "b-warn",
  "overdue":    "b-bad"
};

var session = { actor: "", pin: "" };   /* in memory only — never stored */

function renderBoard(data) {
  el("cycle").textContent = fmtCycleDay(data.cycle.start) + " – " + fmtCycleDay(data.cycle.end);
  el("updated").textContent = "Updated " + fmtDateTime(data.updated);

  var rows = (data.hcas || []).map(function (h) {
    var cls = BADGE[String(h.status || "").toLowerCase()] || "b-warn";
    var when = h.meetingStart
      ? '<div class="when">' + esc(fmtDateTime(h.meetingStart)) + "</div>"
      : "";
    return '<div class="row"><span class="nm">' + esc(h.name) + "</span>" +
           '<span class="badge ' + cls + '">' + esc(h.status) + "</span>" + when + "</div>";
  }).join("");
  el("board").innerHTML = rows || '<p class="muted">No HCAs on the roster.</p>';

  var sel = el("hca");
  if (sel.options.length <= 1) {
    (data.hcas || []).forEach(function (h) {
      var o = document.createElement("option");
      o.value = h.name; o.textContent = h.name;
      sel.appendChild(o);
    });
  }
}

function loadBoard() {
  api({ action: "status" }, function (d) {
    if (!d || !d.ok) { el("board").innerHTML = '<p class="msg m-bad">' + esc((d && d.error) || "Could not load the roster.") + "</p>"; return; }
    renderBoard(d);
  }, function (msg) {
    el("board").innerHTML = '<p class="msg m-bad">' + esc(msg) + "</p>";
  });
}

/* ---- sign in: availability with no hca proves the name + PIN ---- */
el("signin").addEventListener("click", function () {
  var actor = el("actor").value.trim();
  var pin = el("pin").value.trim();
  if (!actor || pin.length < 4) { note("authMsg", "Enter your name and all 4 digits.", "bad"); return; }
  this.disabled = true;
  note("authMsg", "Checking…", "info");
  api({ action: "availability", actor: actor, pin: pin }, function (d) {
    el("signin").disabled = false;
    if (!d || !d.ok) { note("authMsg", (d && d.error) || "Sign in failed.", "bad"); return; }
    if (!d.isAdmin) { note("authMsg", "That account can't book 1:1s.", "bad"); return; }
    session.actor = actor; session.pin = pin;
    el("pin").value = "";
    el("who").textContent = d.actor || actor;
    note("authMsg", "", "ok");
    el("authBox").classList.add("hide");
    el("bookBox").classList.remove("hide");
  }, function (msg) {
    el("signin").disabled = false;
    note("authMsg", msg, "bad");
  });
});

el("signout").addEventListener("click", function () {
  session.actor = ""; session.pin = "";
  el("bookBox").classList.add("hide");
  el("authBox").classList.remove("hide");
  el("slotWrap").classList.add("hide");
  el("hca").value = "";
  note("bookMsg", "", "ok");
});

/* ---- pick an HCA -> load their open slots ---- */
var chosenStart = "";

el("hca").addEventListener("change", function () {
  var hca = this.value;
  chosenStart = "";
  el("book").disabled = true;
  note("bookMsg", "", "ok");
  if (!hca) { el("slotWrap").classList.add("hide"); return; }
  el("slotWrap").classList.remove("hide");
  el("slots").innerHTML = '<span class="muted">Loading open times…</span>';

  api({ action: "availability", actor: session.actor, pin: session.pin, hca: hca }, function (d) {
    if (!d || !d.ok) { el("slots").innerHTML = ""; note("bookMsg", (d && d.error) || "Could not load times.", "bad"); return; }
    renderBoard(d);
    var open = (d.slots || []).filter(function (s) { return s.available; });
    if (!open.length) {
      el("slots").innerHTML = '<span class="muted">No open times in the next 3 weeks for this HCA.</span>';
      return;
    }
    el("slots").innerHTML = open.map(function (s) {
      return '<button type="button" class="slot" data-start="' + esc(s.start) + '">' + esc(fmtSlot(s.start)) + "</button>";
    }).join("");
  }, function (msg) {
    el("slots").innerHTML = "";
    note("bookMsg", msg, "bad");
  });
});

el("slots").addEventListener("click", function (ev) {
  var b = ev.target.closest(".slot");
  if (!b) return;
  Array.prototype.forEach.call(this.querySelectorAll(".slot"), function (x) { x.classList.remove("sel"); });
  b.classList.add("sel");
  chosenStart = b.getAttribute("data-start");
  el("book").disabled = false;
});

/* ---- book ---- */
el("book").addEventListener("click", function () {
  var hca = el("hca").value;
  if (!hca || !chosenStart) return;
  this.disabled = true;
  note("bookMsg", "Booking…", "info");
  api({
    action: "book", actor: session.actor, pin: session.pin,
    hca: hca, start: chosenStart, notes: el("notes").value
  }, function (d) {
    if (!d || !d.ok) {
      el("book").disabled = false;
      note("bookMsg", (d && d.error) || "The booking failed.", "bad");
      return;
    }
    renderBoard(d);
    note("bookMsg", hca + " is booked for " + fmtSlot(chosenStart) + ". The invite is on their calendar.", "ok");
    el("notes").value = "";
    chosenStart = "";
    el("slots").innerHTML = "";
    el("slotWrap").classList.add("hide");
    el("hca").value = "";
  }, function (msg) {
    el("book").disabled = false;
    note("bookMsg", msg, "bad");
  });
});

loadBoard();
</script>
</body>
</html>
