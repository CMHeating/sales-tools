<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating Install Availability Audit</title>
<style>
  :root {
    --brand: #005aa9;
    --brand-dark: #064b82;
    --orange: #f58220;
    --bg: #f4f7fb;
    --card: #ffffff;
    --border: #d8e0ea;
    --text: #102a43;
    --muted: #52677a;
    --danger: #b42318;
    --ok: #027a48;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--brand);
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--orange);
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-block img {
    height: 42px;
    background: white;
    border-radius: 6px;
    padding: 3px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.15;
  }

  .sub {
    font-size: 14px;
    opacity: 0.95;
    margin-top: 2px;
  }

  main {
    max-width: 1280px;
    margin: 22px auto;
    padding: 0 16px 32px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 10px rgba(16, 24, 40, 0.06);
    margin-bottom: 18px;
  }

  .login-row {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(120px, 200px) auto;
    gap: 12px;
    align-items: end;
  }

  label {
    display: block;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
  }

  select,
  input {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: white;
  }

  button,
  a.button-link {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    font-weight: 700;
    cursor: pointer;
    background: var(--brand);
    color: white;
    min-height: 40px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  button:hover,
  a.button-link:hover {
    background: var(--brand-dark);
  }

  button.secondary,
  a.secondary {
    background: #eef4ff;
    color: var(--brand-dark);
    border: 1px solid #c7d7fe;
  }

  .hidden { display: none !important; }

  .status {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
  }

  .status.error {
    color: var(--danger);
    font-weight: 700;
  }

  .status.ok {
    color: var(--ok);
    font-weight: 700;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .meta {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
  }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .filters input,
  .filters select {
    max-width: 260px;
  }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
    background: white;
  }

  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
    font-size: 13px;
  }

  th {
    background: #f8fafc;
    color: #475467;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 12px;
  }

  tr:last-child td { border-bottom: 0; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }

  .pill {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 8px;
    background: #eef4ff;
    border: 1px solid #c7d7fe;
    color: var(--brand-dark);
    font-weight: 700;
    font-size: 12px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }

  @media (max-width: 760px) {
    .login-row {
      grid-template-columns: 1fr;
    }

    .brand-block img {
      display: none;
    }
  }
</style>
</head>
<body>
<header>
  <div class="brand-block">
    <img src="cm-logo.png" alt="CM Heating logo">
    <div>
      <h1>CM Heating Install Availability Audit</h1>
      <div class="sub">Admin-only audit log viewer</div>
    </div>
  </div>
  <div>
    <a class="button-link secondary" href="index.html">Back to Board</a>
    <button id="signOutBtn" class="secondary hidden" type="button">Sign Out</button>
  </div>
</header>

<main>
  <section id="loginCard" class="card">
    <h2 style="margin-top:0;">Admin Login</h2>
    <div class="login-row">
      <div>
        <label for="adminEmail">Admin</label>
        <select id="adminEmail">
          <option value="geoffrey.simons@cmheating.com">Geoff Simons</option>
          <option value="amy@cmheating.com">Amy Liebel</option>
          <option value="laura.weiss@cmheating.com">Laura Weiss</option>
          <option value="jazryn.delacruz@cmheating.com">Jazryn Delacruz</option>
          <option value="sabrina.kennard@cmheating.com">Sabrina Kennard</option>
          <option value="jennifer@cmheating.com">Jennifer</option>
          <option value="bmiller@cmheating.com">B. Miller</option>
          <option value="vanessa.williams@cmheating.com">Vanessa Williams</option>
        </select>
      </div>
      <div>
        <label for="pinInput">PIN</label>
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password">
      </div>
      <button id="loginBtn" type="button">Open Audit</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="auditCard" class="card hidden">
    <div class="toolbar">
      <div>
        <h2 style="margin:0;">Audit Events</h2>
        <div id="meta" class="meta">Loading...</div>
      </div>
      <button id="refreshBtn" type="button">Refresh</button>
    </div>

    <div class="filters">
      <input id="searchInput" type="search" placeholder="Search editor, project, team, cell..." />
      <select id="roleFilter">
        <option value="">All roles</option>
        <option value="ADMIN">Admin</option>
        <option value="HCA">HCA</option>
        <option value="UNKNOWN">Unknown</option>
      </select>
      <button id="exportBtn" type="button">Export CSV</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>User</th>
            <th>Action</th>
            <th>Area</th>
            <th>Details</th>
            <th>ID</th>
          </tr>
        </thead>
        <tbody id="auditBody">
          <tr><td colspan="6" class="empty">Sign in to load audit logs.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, query, limitToLast, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAHnZ4r-WFQECx0XXqLuo8sqw6eoI1gEC0",
  authDomain: "install-availability-tracker.firebaseapp.com",
  databaseURL: "https://install-availability-tracker-default-rtdb.firebaseio.com",
  projectId: "install-availability-tracker",
  storageBucket: "install-availability-tracker.firebasestorage.app",
  messagingSenderId: "187871662912",
  appId: "1:187871662912:web:1d52671de23c4f38d620a5"
};

const ADMIN_EMAILS = new Set([
  "geoffrey.simons@cmheating.com",
  "amy@cmheating.com",
  "laura.weiss@cmheating.com",
  "jazryn.delacruz@cmheating.com",
  "sabrina.kennard@cmheating.com",
  "jennifer@cmheating.com",
  "bmiller@cmheating.com",
  "vanessa.williams@cmheating.com"
]);

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);
const auth = getAuth(app);

const loginCard = document.getElementById("loginCard");
const auditCard = document.getElementById("auditCard");
const adminEmail = document.getElementById("adminEmail");
const pinInput = document.getElementById("pinInput");
const loginBtn = document.getElementById("loginBtn");
const signOutBtn = document.getElementById("signOutBtn");
const refreshBtn = document.getElementById("refreshBtn");
const exportBtn = document.getElementById("exportBtn");
const searchInput = document.getElementById("searchInput");
const roleFilter = document.getElementById("roleFilter");
const statusEl = document.getElementById("status");
const meta = document.getElementById("meta");
const auditBody = document.getElementById("auditBody");

let activeAuditQuery = null;
let allRows = [];

function setStatus(message, cssClass) {
  statusEl.textContent = message || "";
  statusEl.className = "status" + (cssClass ? " " + cssClass : "");
}

function isAdmin(email) {
  return ADMIN_EMAILS.has(String(email || "").toLowerCase());
}

function currentEmail() {
  return auth.currentUser && auth.currentUser.email ? auth.currentUser.email.toLowerCase() : "";
}

function showLogin() {
  loginCard.classList.remove("hidden");
  auditCard.classList.add("hidden");
  signOutBtn.classList.add("hidden");
  if (activeAuditQuery) {
    off(activeAuditQuery);
    activeAuditQuery = null;
  }
}

function showAudit() {
  loginCard.classList.add("hidden");
  auditCard.classList.remove("hidden");
  signOutBtn.classList.remove("hidden");
}

function pick(obj, keys) {
  for (const key of keys) {
    if (obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== "") return obj[key];
  }
  return "";
}

function safe(value) {
  if (value === undefined || value === null || value === "") return "—";
  if (typeof value === "object") return JSON.stringify(value, null, 2);
  return String(value);
}

function formatTime(value) {
  if (!value) return "—";
  const date = typeof value === "number" ? new Date(value) : new Date(value);
  if (Number.isNaN(date.getTime())) return safe(value);
  return date.toLocaleString("en-US", {
    timeZone: "America/Los_Angeles",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit"
  });
}

function userFor(log) {
  const name = pick(log, ["editorName", "userName", "user", "actor", "email", "userEmail"]);
  const role = pick(log, ["editorRole", "role"]);
  if (name && role) return name + " (" + role + ")";
  return name || "—";
}

function actionFor(log) {
  const explicit = pick(log, ["action", "event", "type"]);
  if (explicit) return explicit;

  const previousStatus = pick(log, ["previousStatus", "oldStatus"]);
  const newStatus = pick(log, ["newStatus", "status"]);
  if (previousStatus || newStatus) {
    return (previousStatus || "—") + " → " + (newStatus || "—");
  }

  return "—";
}

function areaFor(log) {
  if (log.sourceArea || log.targetArea) {
    return [log.sourceArea || "source", "→", log.targetArea || "target"].join(" ");
  }

  const directArea = pick(log, ["area", "auditArea", "cellArea"]);
  if (directArea) return directArea;

  const sourceContext = log.sourceContext || null;
  const targetContext = log.targetContext || null;
  if (sourceContext || targetContext) {
    const sourceArea = sourceContext && sourceContext.area ? sourceContext.area : "";
    const targetArea = targetContext && targetContext.area ? targetContext.area : "";
    return [sourceArea || "source", "→", targetArea || "target"].join(" ");
  }

  const parts = [
    pick(log, ["dayLabel", "dateLabel", "dayName"]),
    pick(log, ["teamName", "team"]),
    pick(log, ["crewName", "crew"])
  ].filter(Boolean);

  if (parts.length) return parts.join(" · ");

  const weekTitle = pick(log, ["weekTitle", "week", "weekName"]);
  const cellKey = pick(log, ["cellKey", "sourceKey", "targetKey"]);
  if (weekTitle && cellKey) return weekTitle + " · " + cellKey;
  if (weekTitle) return weekTitle;
  if (cellKey) return cellKey;

  return "—";
}

function summarizeJob(slot, job) {
  if (!job) return "";
  const label = slot === "fullDay" ? "Full Day" : slot.toUpperCase();
  const hca = job.hcaName || "";
  const project = job.projectName || "";
  const caas = job.isCaas === true || job.isCaas === "true" ? "CaaS" : "Standard";
  const parts = [hca, project, caas].filter(Boolean);
  return parts.length ? label + ": " + parts.join(" / ") : "";
}

function summarizeJobs(jobs) {
  if (!jobs) return "";
  return ["fullDay", "am", "pm"].map((slot) => summarizeJob(slot, jobs[slot])).filter(Boolean).join(" | ");
}

function detailsFor(log) {
  const details = [];

  const jobSummary = summarizeJobs(log.jobs);
  if (jobSummary) details.push(jobSummary);

  const previousJobSummary = log.previousDetails && log.previousDetails.jobs
    ? summarizeJobs(log.previousDetails.jobs)
    : "";
  if (previousJobSummary) details.push("Previous: " + previousJobSummary);

  const soldType = pick(log, ["soldType", "sourceSoldType"]);
  if (soldType) details.push("Sold type: " + soldType);

  if (log.cellKey) details.push("Cell: " + log.cellKey);
  if (log.sourceKey || log.targetKey) {
    details.push("Source: " + safe(log.sourceKey));
    details.push("Target: " + safe(log.targetKey));
  }

  const previousStatus = pick(log, ["previousStatus", "oldStatus"]);
  const newStatus = pick(log, ["newStatus", "status"]);
  if (previousStatus || newStatus) {
    details.push("Status: " + (previousStatus || "—") + " → " + (newStatus || "—"));
  }

  if (details.length) return details.join("\n");

  return JSON.stringify(log, null, 2);
}

function csvEscape(value) {
  return '"' + String(value ?? "").replaceAll('"', '""') + '"';
}

function currentFilteredRows() {
  const search = searchInput.value.trim().toLowerCase();
  const role = roleFilter.value.trim().toUpperCase();

  return allRows.filter((row) => {
    const log = row.log;
    const roleValue = String(pick(log, ["editorRole", "role"]) || "UNKNOWN").toUpperCase();
    if (role && roleValue !== role) return false;

    if (!search) return true;

    const haystack = [
      row.id,
      formatTime(row.timestamp),
      userFor(log),
      actionFor(log),
      areaFor(log),
      detailsFor(log),
      JSON.stringify(log)
    ].join(" ").toLowerCase();

    return haystack.includes(search);
  });
}

function renderRows() {
  const rows = currentFilteredRows();
  auditBody.innerHTML = "";

  if (!rows.length) {
    auditBody.innerHTML = '<tr><td colspan="6" class="empty">No matching audit logs found.</td></tr>';
    meta.textContent = allRows.length + " events loaded · 0 shown";
    return;
  }

  for (const row of rows) {
    const log = row.log;
    const tr = document.createElement("tr");

    const cells = [
      formatTime(row.timestamp),
      userFor(log),
      actionFor(log),
      areaFor(log),
      detailsFor(log),
      row.id
    ];

    cells.forEach((cell, index) => {
      const td = document.createElement("td");
      if (index === 2 && cell !== "—") {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = cell;
        td.appendChild(span);
      } else {
        if (index >= 4) td.className = "mono";
        td.textContent = cell;
      }
      tr.appendChild(td);
    });

    auditBody.appendChild(tr);
  }

  meta.textContent =
    allRows.length + " events loaded · " +
    rows.length + " shown · Last refreshed " +
    new Date().toLocaleTimeString("en-US", { timeZone: "America/Los_Angeles" });
}

function ingestLogs(value) {
  allRows = Object.entries(value || {}).map(([id, log]) => {
    const timestamp = pick(log, ["timestamp", "createdAt", "time"]);
    const sortTime = new Date(timestamp || 0).getTime() || 0;
    return { id, log: log || {}, timestamp, sortTime };
  }).sort((a, b) => b.sortTime - a.sortTime || b.id.localeCompare(a.id));

  renderRows();
}

function loadAudit() {
  if (!isAdmin(currentEmail())) {
    showLogin();
    setStatus("Admin auth required.", "error");
    return;
  }

  if (activeAuditQuery) {
    off(activeAuditQuery);
    activeAuditQuery = null;
  }

  meta.textContent = "Loading...";
  auditBody.innerHTML = '<tr><td colspan="6" class="empty">Loading audit logs...</td></tr>';

  activeAuditQuery = query(ref(db, "cmh_audit_logs"), limitToLast(500));

  onValue(activeAuditQuery, function(snapshot) {
    ingestLogs(snapshot.val());
  }, function(error) {
    meta.textContent = "Audit read failed.";
    auditBody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6;
    td.className = "empty";
    td.textContent = "Firebase blocked or failed the audit read: " + error.message;
    tr.appendChild(td);
    auditBody.appendChild(tr);
  });
}

async function login() {
  const email = adminEmail.value.trim().toLowerCase();
  const pin = pinInput.value.trim();

  if (!isAdmin(email)) {
    setStatus("This user is not authorized for audit access.", "error");
    return;
  }

  if (!pin) {
    setStatus("Enter your admin PIN.", "error");
    return;
  }

  loginBtn.disabled = true;
  setStatus("Signing in...", "");

  try {
    await signInWithEmailAndPassword(auth, email, "CMH-" + pin + "!");
    if (!isAdmin(currentEmail())) {
      await signOut(auth);
      throw new Error("Signed-in user is not an admin.");
    }
    setStatus("Signed in.", "ok");
    showAudit();
    loadAudit();
  } catch (error) {
    setStatus("Login failed: " + error.message, "error");
  } finally {
    loginBtn.disabled = false;
  }
}

function exportCsv() {
  const rows = currentFilteredRows();
  const csv = [
    ["Time", "User", "Action", "Area", "Details", "ID"].map(csvEscape).join(",")
  ];

  rows.forEach((row) => {
    const log = row.log;
    csv.push([
      formatTime(row.timestamp),
      userFor(log),
      actionFor(log),
      areaFor(log),
      detailsFor(log),
      row.id
    ].map(csvEscape).join(","));
  });

  const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cmh-install-availability-audit.csv";
  a.click();
  URL.revokeObjectURL(url);
}

loginBtn.addEventListener("click", login);
pinInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") login();
});
refreshBtn.addEventListener("click", loadAudit);
searchInput.addEventListener("input", renderRows);
roleFilter.addEventListener("change", renderRows);
exportBtn.addEventListener("click", exportCsv);
signOutBtn.addEventListener("click", async function() {
  await signOut(auth);
  showLogin();
  setStatus("Signed out.", "");
});

onAuthStateChanged(auth, async function(user) {
  if (!user) {
    showLogin();
    return;
  }

  if (!isAdmin(user.email)) {
    await signOut(auth);
    showLogin();
    setStatus("This signed-in user is not authorized for audit access.", "error");
    return;
  }

  showAudit();
  loadAudit();
});
</script>
</body>
</html>
